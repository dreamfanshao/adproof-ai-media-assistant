<!doctype html><meta charset=utf-8><title>达人检索 Agent</title><style>body{font:14px Arial;background:#f5f8fc;color:#17233a;margin:0}main{max-width:1150px;margin:30px auto;background:white;padding:28px;border-radius:18px}textarea{width:100%;min-height:100px;box-sizing:border-box;padding:12px;border:1px solid #d7e1ef;border-radius:10px}button{background:#4778ee;color:white;border:0;border-radius:8px;padding:10px 18px;margin:10px 8px 10px 0}pre{white-space:pre-wrap;background:#f6f8fb;padding:12px;border-radius:8px;max-height:360px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.step{border:1px solid #dfe7f2;border-radius:10px;padding:12px;margin:10px 0}</style><main><h1>达人检索 Agent</h1><p>找达人使用 Skills Agent；内容审核仍由现有 Workflow 执行。</p><label>一句话检索需求</label><textarea id=q>粉丝小于1500，活跃度较高，做过光子嫩肤或有雀斑困扰</textarea><label>候选达人 JSON（可选）</label><textarea id=c placeholder='[{"id":"1","nickname":"示例","followers":1200,"bio":"...","imageUrls":[]}]'></textarea><button onclick=mk()>生成计划</button><button onclick=go()>执行 Agent</button><div class=grid><section><h2>计划</h2><pre id=p>尚未生成</pre></section><section><h2>状态</h2><pre id=s>尚未执行</pre></section></div><h2>步骤日志</h2><div id=l></div><h2>结果</h2><pre id=r>尚未执行</pre></main><script>const C=()=>{try{return JSON.parse(c.value||'[]')}catch{return alert('JSON 格式错误'),[]}};async function mk(){p.textContent=JSON.stringify(await (await fetch('/api/agent/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q.value,candidates:C()})})).json(),null,2)}async function go(){const v=await (await fetch('/api/agent/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q.value,candidates:C()})})).json();p.textContent=JSON.stringify(v.plan,null,2);s.textContent=JSON.stringify({status:v.status,disclaimer:v.disclaimer,structuredQuery:v.structuredQuery},null,2);r.textContent=JSON.stringify({candidates:v.candidates,summary:v.summary},null,2);l.innerHTML=(v.steps||[]).map(x=>'<div class=step><b>'+x.capabilityType+' · '+x.capabilityId+'</b> <span>'+x.status+'</span><pre>'+JSON.stringify({input:x.input,output:x.output,note:x.note},null,2)+'</pre></div>').join('')}</script>
