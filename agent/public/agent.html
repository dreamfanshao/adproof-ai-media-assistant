<!doctype html><meta charset="utf-8"><title>达人检索 Agent</title><style>body{font:14px Arial;margin:0;background:#f5f8fc;color:#17233a}main{max-width:1180px;margin:32px auto;background:#fff;padding:28px;border-radius:18px}textarea{width:100%;box-sizing:border-box;min-height:100px;padding:12px;border:1px solid #d8e1ef;border-radius:10px}button{background:#4778ee;color:#fff;border:0;border-radius:8px;padding:11px 18px;margin:10px 8px 10px 0;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid #dfe7f2;border-radius:12px;padding:16px;margin:12px 0}pre{white-space:pre-wrap;max-height:340px;overflow:auto;background:#f7f9fc;padding:12px;border-radius:8px}.muted{color:#6b7b92}</style><main><h1>达人检索 Agent</h1><p class="muted">Planner 负责生成 Skill/Tool 计划；Executor 逐步执行并记录输入输出。内容审核仍在主系统 Workflow 中。</p><label>检索需求</label><textarea id="query">粉丝小于1500，活跃度较高，做过光子嫩肤或有雀斑困扰</textarea><label>候选达人 JSON（可选）</label><textarea id="candidates" placeholder='[{"id":"1","nickname":"示例","followers":1200,"bio":"...","imageUrls":[]}]'></textarea><p><button onclick="plan()">生成计划</button><button onclick="run()">执行 Agent</button></p><div class="grid"><section><h2>Planner 计划</h2><pre id="plan">尚未生成</pre></section><section><h2>运行状态</h2><pre id="status">尚未执行</pre></section></div><section><h2>每一步输入 / 输出</h2><div id="steps"></div></section><section><h2>最终候选与证据</h2><pre id="result">尚未执行</pre></section></main><script>const q=()=>document.getElementById('query').value;const c=()=>{try{return JSON.parse(document.getElementById('candidates').value||'[]')}catch(e){alert('候选 JSON 格式错误');return []}};async function plan(){const r=await fetch('/api/agent/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q(),candidates:c()})});document.getElementById('plan').textContent=JSON.stringify(await r.json(),null,2)}async function run(){const r=await fetch('/api/agent/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q(),candidates:c()})});const v=await r.json();document.getElementById('status').textContent=JSON.stringify({status:v.status,disclaimer:v.disclaimer,structuredQuery:v.structuredQuery},null,2);document.getElementById('plan').textContent=JSON.stringify(v.plan,null,2);document.getElementById('result').textContent=JSON.stringify({candidates:v.candidates,summary:v.summary},null,2);document.getElementById('steps').innerHTML=(v.steps||[]).map(s=>'<div class="card"><b>'+s.capabilityType+' · '+s.capabilityId+'</b><p>'+s.status+'</p><pre>'+JSON.stringify({input:s.input,output:s.output,note:s.note},null,2)+'</pre></div>').join('')}</script>
