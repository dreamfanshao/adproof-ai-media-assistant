<!doctype html><meta charset="utf-8"><title>Skill 管理</title><style>body{font:14px Arial;margin:0;background:#f5f8fc;color:#17233a}main{max-width:1200px;margin:32px auto;background:#fff;padding:28px;border-radius:18px}.skill{border:1px solid #dfe7f2;border-radius:12px;padding:18px;margin:14px 0}input,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d8e1ef;border-radius:8px;margin:5px 0 12px}textarea{min-height:90px}button{background:#4778ee;color:#fff;border:0;border-radius:8px;padding:9px 15px;margin-right:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{color:#6b7b92}pre{white-space:pre-wrap;background:#f7f9fc;padding:10px}</style><main><h1>Skill 管理</h1><p class="muted">只有已启用的 Skill 才允许 Planner 调用。保存后立即影响下一次 Agent 运行。</p><div id="list">加载中…</div></main><script>async function load(){const r=await fetch('/api/agent/skills');const skills=await r.json();document.getElementById('list').innerHTML=skills.map((s,i)=>'<article class="skill"><h2>'+s.name+' <small>'+s.id+'</small></h2><div class="row"><label>名称<input id="n'+i+'" value="'+esc(s.name)+'"></label><label>模型<input id="m'+i+'" value="'+esc(s.model)+'"></label></div><label>描述<input id="d'+i+'" value="'+esc(s.description)+'"></label><label>Prompt<textarea id="p'+i+'">'+esc(s.prompt)+'</textarea></label><label><input type="checkbox" id="e'+i+'" '+(s.enabled?'checked':'')+'> 启用</label><p><button onclick="save('+i+',\''+s.id+'\')">保存</button><button onclick="test('+i+',\''+s.id+'\')">测试 Skill</button></p><pre id="o'+i+'"></pre></article>').join('')}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}async function save(i,id){await fetch('/api/agent/skills/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.getElementById('n'+i).value,model:document.getElementById('m'+i).value,description:document.getElementById('d'+i).value,prompt:document.getElementById('p'+i).value,enabled:document.getElementById('e'+i).checked})});alert('已保存')}async function test(i,id){const r=await fetch('/api/agent/skills/'+id+'/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:'请用 JSON 返回一个最小示例，并说明当前是否实际调用了模型。'})});document.getElementById('o'+i).textContent=JSON.stringify(await r.json(),null,2)}load()</script>
