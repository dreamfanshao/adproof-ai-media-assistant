<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 控制台</title><link rel="stylesheet" href="/module.css"></head>
<body>
<div class="app">
  <aside class="rail"><div class="brand"><i class="brand-mark"></i><span><strong>媒介助手</strong><small>AGENT WORKSPACE</small></span></div><div class="module-label">业务模块</div><nav id="railNav"></nav><div class="rail-footer"><strong>真实 Agent 链路</strong><br>输入会经过 Planner、Skills、Tools 和风险结果记录。</div></aside>
  <section class="workspace"><header class="topbar"><div class="title"><h1 id="pageTitle">Agent 控制台</h1><p id="pageSubtitle"></p></div><nav class="global-tabs" id="globalTabs"></nav></header>
    <main class="content"><div class="module-stripe"></div><div id="notice" class="notice"></div>
      <section class="section agent-console-head"><div class="section-head"><div><h2 id="moduleTitle"></h2><p>输入一个真实业务问题，查看 Planner 计划、Skill/Tool Trace、最终回复与风险状态。达人模块只复用业务系统已经产生的真实 RedFox Agent 记录。</p></div><span class="status REVIEW">本地验证模式</span></div>
        <div class="section-body"><div class="field"><label for="question">业务问题</label><textarea id="question" rows="4"></textarea></div><div class="grid-2"><div class="field"><label for="title">标题（审核模块可选）</label><input id="title"></div><div class="field"><label for="requirements">额外要求</label><input id="requirements"></div></div><div class="toolbar" style="margin-top:14px"><button class="btn" id="run">运行 Agent</button><button class="btn secondary" id="clear">清空</button><span class="chip" id="runtime">等待运行</span></div></div>
      </section>
      <section class="section" id="resultSection"><div class="section-head"><div><h2>运行结果</h2><p>每一步都来自服务端 Agent 链路；错误不会被伪装成成功。</p></div><span id="risk" class="status REVIEW">尚未运行</span></div><div class="section-body"><div id="empty" class="empty"><strong>还没有运行记录</strong>输入问题后点击“运行 Agent”。</div><div id="result" hidden><div class="grid-3" id="resultMetrics"></div><h3>Planner / 能力计划</h3><div id="plan" class="trace-list"></div><h3>步骤 Trace</h3><div id="steps" class="trace-list"></div><h3>最终回复</h3><pre id="finalReply" class="mono"></pre></div></div></section>
    </main>
  </section>
</div>
<script>
const moduleId=location.pathname.split('/').filter(Boolean).pop()==='audit'?'audit':'creators';
const creator=moduleId==='creators',moduleName=creator?'达人检索':'内容审核',accent=creator?'creator':'audit';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sample=creator?'粉丝小于1500、活跃度较高、做过光子嫩肤或有雀斑困扰的素人达人':'审核这篇小红书图文：全网第一、百分百祛斑、无副作用。';
$('question').value=sample;$('moduleTitle').textContent=moduleName+' Agent';$('pageSubtitle').textContent=creator?'自然语言检索、语义匹配与证据排序':'图文内容合规、广告法规则与人工复核';
function nav(){const links=[['/agent/'+moduleId,'Agent 控制台'],['/admin/'+moduleId+'?focus=skills','Skills'],['/admin/'+moduleId+'?focus=tools','Tools'],['/planner/'+moduleId,'Planner'],['/models/'+moduleId,'模型管理'],['/ops/'+moduleId,'运营中心'],['/catalog/'+moduleId,'数据中心']];$('globalTabs').innerHTML=links.map(([href,label],i)=>`<a class="${i===0?'active':''}" href="${href}">${label}</a>`).join('');$('railNav').innerHTML=`<a href="http://127.0.0.1:5173/${creator?'creators':'audit/new'}">返回业务系统</a><a class="active ${accent}-active" href="/agent/${moduleId}">${moduleName} Agent</a><a href="/ops/${moduleId}">${moduleName} Eval</a><a href="/admin/${moduleId}?focus=skills">Skills / Tools</a><a href="/planner/${moduleId}">Planner</a>`}
function message(text,ok=false){const n=$('notice');n.textContent=text;n.className='notice show '+(ok?'ok':'');}
async function api(path,options){const r=await fetch(path,{cache:'no-store',...options}),b=await r.json();if(!r.ok)throw Error(b?.data?.error||'请求失败');return b.data}
function renderResult(data){$('empty').hidden=true;$('result').hidden=false;$('runtime').textContent=`${data.provider||'provider'} · ${data.model||'model'} · ${data.durationMs} ms`;$('risk').textContent=`风险：${data.risk?.status||'REVIEW'}`;$('risk').className='status '+(data.risk?.status==='low'?'PASS':data.risk?.status==='ERROR'?'ERROR':'REVIEW');$('resultMetrics').innerHTML=`<div class="metric"><span>Run ID</span><strong style="font-size:15px">${esc(data.runId)}</strong><em>${esc(data.status)}</em></div><div class="metric"><span>计划步骤</span><strong>${data.plan?.length||0}</strong><em>Planner 输出</em></div><div class="metric"><span>数据来源</span><strong style="font-size:15px">${esc(data.dataSource||'user-input')}</strong><em>${data.sourceRunId?'来源 Run '+esc(data.sourceRunId):'审核文本来自当前输入'}</em></div><div class="metric"><span>风险状态</span><strong>${esc(data.risk?.status||'REVIEW')}</strong><em>${esc(data.risk?.note||'')}</em></div>`;$('plan').innerHTML=(data.plan||[]).map(step=>`<div class="trace-item"><span class="chip ${accent}">${esc(step.capabilityId||step.id)}</span><span>${esc(step.status)}</span></div>`).join('')||'<div class="empty">没有返回计划</div>';$('steps').innerHTML=(data.steps||[]).map((step,index)=>`<details class="trace-item"><summary>${index+1}. ${esc(step.capabilityId||step.id||'step')} · ${esc(step.status||'unknown')}</summary><pre class="mono">${esc(JSON.stringify(step,null,2))}</pre></details>`).join('')||'<div class="empty">没有步骤 Trace</div>';$('finalReply').textContent=String(data.finalReply||'');}
$('run').onclick=async()=>{const question=$('question').value.trim();if(!question)return message('请输入业务问题');$('run').disabled=true;$('run').textContent='运行中…';message('');try{const data=await api('/api/module-agent/'+moduleId+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,title:$('title').value,requirements:$('requirements').value,body:question})});renderResult(data);message('Agent 运行完成',true)}catch(error){message(error.message);$('risk').textContent='运行失败';$('risk').className='status ERROR'}finally{$('run').disabled=false;$('run').textContent='运行 Agent'}};
$('clear').onclick=()=>{$('question').value='';$('title').value='';$('requirements').value='';$('empty').hidden=false;$('result').hidden=true;$('runtime').textContent='等待运行';$('risk').textContent='尚未运行';$('risk').className='status REVIEW';message('')};nav();
</script></body></html>
