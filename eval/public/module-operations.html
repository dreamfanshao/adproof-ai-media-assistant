<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>运营中心</title>
  <style>
    :root{--ink:#10233f;--muted:#637792;--line:#d7e1ec;--panel:#fff;--canvas:#f5f7fa;--blue:#3567eb;--green:#078b76;--green-soft:#e9f7f3;--amber:#b86a08;--amber-soft:#fff7e7;--red:#bd352e;--red-soft:#fff0ee;--shadow:0 10px 30px rgba(29,55,90,.07)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.page{max-width:1580px;margin:auto;padding:28px 32px 56px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#7186a3}.head h1{margin:8px 0 6px;font-size:34px;line-height:1.1}.head p{margin:0;color:var(--muted)}.mode{border:1px solid #a9dfcf;background:var(--green-soft);color:#076c5d;border-radius:999px;padding:9px 14px;white-space:nowrap}.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px;border:1px solid var(--line);border-radius:16px;background:#edf2f8;scrollbar-width:thin;position:sticky;top:0;z-index:5}.tab{border:0;background:transparent;color:#536984;font-weight:700;padding:12px 17px;border-radius:11px;white-space:nowrap}.tab[aria-selected="true"]{background:#fff;color:var(--green);box-shadow:0 3px 12px rgba(29,55,90,.1)}.tab:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(53,103,235,.28);outline-offset:2px}.notice{min-height:46px;margin:16px 0}.notice:not(:empty){padding:12px 15px;border:1px solid #f1cc82;background:var(--amber-soft);color:#8a520b;border-radius:12px}.notice.error{border-color:#efb7b0;background:var(--red-soft);color:var(--red)}.panel{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0 0 5px;font-size:22px}.panel-head p{margin:0;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.panel-body{padding:22px 24px}.btn{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--red)}.btn:disabled{opacity:.48;cursor:not-allowed}.icon-btn{border:0;background:transparent;color:var(--blue);padding:6px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}.metric .label{font-size:14px;color:var(--muted)}.metric strong{display:block;margin:8px 0 4px;font-size:30px}.metric small{color:var(--green)}.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(310px,.55fr);gap:16px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.field{display:grid;gap:7px;min-width:180px}.field label{font-size:13px;font-weight:700;color:#4d627e}.field input,.field textarea,.field select,.control{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px}.field textarea{min-height:100px;resize:vertical}.grid-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.span-2{grid-column:1/-1}.list{display:grid;gap:10px}.row{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff}.row-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.row h3{margin:0 0 7px;font-size:17px}.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:13px}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#edf3ff;color:#315fcf;font-size:12px;font-weight:750}.badge.audit{background:#fff0df;color:#9b5705}.badge.pass{background:var(--green-soft);color:#087562}.badge.fail{background:var(--red-soft);color:var(--red)}.badge.review{background:var(--amber-soft);color:var(--amber)}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.detail{margin-top:12px;padding:12px;background:#f5f8fc;border-radius:10px;color:#435a76;white-space:pre-wrap;overflow-wrap:anywhere}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;color:#5d718a;background:#f8fafc}tr:last-child td{border-bottom:0}.empty{padding:48px 18px;text-align:center;color:var(--muted)}.loading{padding:48px;text-align:center;color:var(--muted)}.result-box{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;white-space:pre-wrap;overflow-wrap:anywhere}.progress{height:8px;background:#e8eef5;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}dialog{width:min(760px,calc(100vw - 32px));border:0;border-radius:18px;box-shadow:0 24px 80px rgba(16,35,63,.28);padding:0}dialog::backdrop{background:rgba(16,35,63,.45)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0}.dialog-body{padding:20px 22px}.dialog-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}.check{display:flex;gap:10px;align-items:flex-start}.check input{margin-top:4px}.hint{font-size:13px;color:var(--muted)}
    @media(max-width:900px){.page{padding:20px 16px 44px}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:28px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.panel-head{align-items:flex-start;flex-direction:column}.panel-body{padding:18px}.grid-form{grid-template-columns:1fr}.span-2{grid-column:auto}.row-top{flex-direction:column}.actions{justify-content:flex-start}}
    @media(max-width:480px){.page{padding:16px 12px 36px}.metrics{grid-template-columns:1fr}.tab{padding:11px 13px}.panel{border-radius:14px}.mode{white-space:normal}.toolbar>*{width:100%}.btn{width:100%}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main class="page">
  <header class="head"><div><div class="eyebrow">ADPROOF WORKSPACE · OPERATIONS</div><h1>运营中心</h1><p>真实评测、数据标注与改进闭环统一管理。</p></div><div class="mode">真实系统任务 · 手动刷新</div></header>
  <nav class="tabs" aria-label="运营中心功能">
    <button class="tab" role="tab" aria-selected="true" data-tab="cases">评测集</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="batches">评测中心</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="annotations">数据标注</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="improvements">改进建议</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="human">人工评估</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="versions">版本回滚</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="ab">Prompt A/B</button>
  </nav>
  <div id="notice" class="notice" aria-live="polite"></div>
  <section id="view" aria-live="polite"><div class="loading">正在读取运营数据…</div></section>
</main>

<dialog id="caseDialog">
  <form id="caseForm" method="dialog">
    <div class="dialog-head"><h2 id="caseDialogTitle">新增评测用例</h2><button class="icon-btn" value="cancel" aria-label="关闭">关闭</button></div>
    <div class="dialog-body grid-form">
      <input type="hidden" name="originalId"/><div class="field"><label>业务模块</label><select name="module"><option value="creators">达人检索</option><option value="audit">内容审核</option></select></div>
      <div class="field"><label>用例 ID</label><input name="id" required placeholder="creator-case-01"/></div>
      <div class="field span-2"><label>名称</label><input name="name" required/></div>
      <div class="field span-2"><label>测试问题</label><textarea name="question" required></textarea></div>
      <div class="field"><label>分类</label><input name="category" value="业务回归"/></div><div class="field"><label>难度</label><select name="difficulty"><option>easy</option><option selected>medium</option><option>hard</option></select></div>
      <div class="field"><label>达人最少结果数（0-20）</label><input name="minimumPersistedCount" type="number" min="0" max="20" value="20"/></div>
      <div class="field"><label>用例说明</label><div class="hint">ID 以字母开头；名称不能只有数字；问题至少 8 个字符。</div></div>
      <div class="field span-2"><label>期望行为（每行一条）</label><textarea name="expectedBehavior" required placeholder="例如：排除机构账号&#10;返回20个新达人或明确候选耗尽"></textarea></div>
      <div class="field"><label>必须命中关键词（逗号分隔）</label><input name="keywords"/></div><div class="field"><label>禁用词（逗号分隔）</label><input name="forbiddenWords"/></div>
    </div>
    <div class="dialog-foot"><button class="btn" value="cancel">取消</button><button class="btn primary" id="saveCase" value="default">保存用例</button></div>
  </form>
</dialog>

<script>
const state={tab:'cases',modules:{creators:null,audit:null},annotations:[],improvements:[],abTests:[],admins:{creators:null,audit:null},selected:new Set(),caseFilter:'all',busy:false};
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const headers={...(options.headers||{})};if(options.body!==undefined&&!Object.keys(headers).some(k=>k.toLowerCase()==='content-type'))headers['content-type']='application/json';const res=await fetch(url,{...options,headers});const raw=await res.text();let body={};try{body=raw?JSON.parse(raw):{}}catch{body={message:raw}}if(!res.ok)throw new Error(body?.data?.error||body?.message||body?.error||`${res.statusText||'请求失败'}（HTTP ${res.status}）`);return body.data??body}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function notify(message,type=''){const el=$('#notice');el.className=`notice ${type}`;el.textContent=message||''}
function moduleName(m){return m==='audit'?'内容审核':'达人检索'}function statusBadge(s){const c=String(s||'').toLowerCase();return `<span class="badge ${c}">${esc(s||'未知')}</span>`}
async function loadCore(){const [creators,audit]=await Promise.all([api('/api/module-eval/creators'),api('/api/module-eval/audit')]);state.modules={creators,audit}}
async function ensure(kind){if(kind==='annotations'||kind==='human')state.annotations=(await api('/api/annotations')).annotations||[];if(kind==='improvements')state.improvements=(await api('/api/improvements?limit=100')).improvements||[];if(kind==='ab')state.abTests=(await api('/api/ab-tests')).tests||[];if(kind==='versions'){const [c,a]=await Promise.all([api('/api/module-admin/creators'),api('/api/module-admin/audit')]);state.admins={creators:c,audit:a}}}
function allCases(){return ['creators','audit'].flatMap(module=>(state.modules[module]?.cases||[]).map(x=>({...x,module}))) }function allRuns(){return ['creators','audit'].flatMap(module=>(state.modules[module]?.runs||[]).map(x=>({...x,module}))).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))}function allBatches(){return ['creators','audit'].flatMap(module=>(state.modules[module]?.batches||[]).map(x=>({...x,module}))).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))}
function metric(label,value,note){return `<div class="metric"><span class="label">${esc(label)}</span><strong>${esc(value)}</strong><small>${esc(note)}</small></div>`}
function renderMonitor(){const a=state.analytics||{};const runs=allRuns().slice(0,20);$('#view').innerHTML=`<section class="metrics">${metric('Agent / Eval 运行',runs.length,'最近业务记录')}${metric('接口调用',a.totalApiCalls??0,'模型与数据服务')}${metric('接口错误',a.totalApiErrors??0,'需要排查')}${metric('今日活跃用户',a.activeUsersToday??0,'按事件去重')}</section><section class="panel"><div class="panel-head"><div><h2>运行监控</h2><p>定位慢请求、错误步骤和需人工复核的运行。</p></div><button class="btn" data-action="refresh">刷新数据</button></div><div class="panel-body"><div class="table-wrap"><table><thead><tr><th>时间</th><th>模块</th><th>用例 / 问题</th><th>状态</th><th>耗时</th><th>Run ID</th></tr></thead><tbody>${runs.map(r=>`<tr><td>${esc(new Date(r.createdAt).toLocaleString())}</td><td><span class="badge ${r.module==='audit'?'audit':''}">${moduleName(r.module)}</span></td><td>${esc(r.question||r.caseId)}</td><td>${statusBadge(r.status)}</td><td>${esc(r.durationMs??0)} ms</td><td>${esc(r.agentRunId||r.id)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">暂无运行记录</td></tr>'}</tbody></table></div></div></section>`}
function renderRatings(){const rows=state.ratings;$('#view').innerHTML=`<div class="split"><section class="panel"><div class="panel-head"><div><h2>服务评分</h2><p>低分回复自动进入改进建议，并保留 runId。</p></div></div><div class="panel-body"><form id="ratingForm" class="grid-form"><div class="field"><label>Run ID</label><input name="runId" placeholder="可选"/></div><div class="field"><label>评分</label><select name="score"><option value="5">5 - 很满意</option><option value="4">4 - 满意</option><option value="3">3 - 一般</option><option value="2">2 - 不满意</option><option value="1">1 - 很差</option></select></div><div class="field span-2"><label>反馈</label><textarea name="comment" required placeholder="说明回复哪里好或需要改进"></textarea></div><div><button class="btn primary">提交评分</button></div></form></div></section><section class="panel"><div class="panel-head"><div><h2>最近评分</h2><p>${rows.length} 条记录</p></div></div><div class="panel-body list">${rows.map(x=>`<div class="row"><div class="row-top"><div><h3>${'★'.repeat(x.score)}${'☆'.repeat(5-x.score)}</h3><div class="meta"><span>${esc(x.runId||'未关联 Run')}</span><span>${esc(new Date(x.createdAt).toLocaleString())}</span></div></div></div><div class="detail">${esc(x.comment||'无备注')}</div></div>`).join('')||'<div class="empty">暂无评分</div>'}</div></section></div>`}
function renderCases(){const cases=allCases().filter(x=>state.caseFilter==='all'||x.module===state.caseFilter);$('#view').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>评测集</h2><p>每条用例可测试、编辑、复制、删除和启用/停用；达人用例未达到数量门槛时记为 REVIEW。</p></div><div class="toolbar"><select class="control" id="caseFilter"><option value="all">全部业务</option><option value="creators">达人检索</option><option value="audit">内容审核</option></select><button class="btn" data-action="select-first">选择前 3 条</button><button class="btn green" data-action="new-case">新增用例</button></div></div><div class="panel-body list">${cases.map(c=>`<article class="row"><div class="row-top"><div class="check"><input type="checkbox" data-select-case="${esc(c.module)}::${esc(c.id)}" ${state.selected.has(`${c.module}::${c.id}`)?'checked':''}/><div><h3>${esc(c.name)}</h3><div class="meta"><span class="badge ${c.module==='audit'?'audit':''}">${moduleName(c.module)}</span><span>${esc(c.category)}</span><span>${esc(c.difficulty)}</span><span>${c.enabled?'已启用':'按需启用'}</span>${c.module==='creators'?`<span>门槛 ${esc(c.minimumPersistedCount??20)} 人</span>`:''}</div></div></div><div class="actions"><button class="btn" data-action="run-case" data-module="${c.module}" data-id="${esc(c.id)}">测试</button><button class="btn" data-action="edit-case" data-module="${c.module}" data-id="${esc(c.id)}">编辑</button><button class="btn" data-action="copy-case" data-module="${c.module}" data-id="${esc(c.id)}">复制</button><button class="btn danger" data-action="delete-case" data-module="${c.module}" data-id="${esc(c.id)}">删除</button><button class="btn" data-action="toggle-case" data-module="${c.module}" data-id="${esc(c.id)}" data-enabled="${c.enabled}">${c.enabled?'停用':'启用'}</button></div></div><div class="detail">问题：${esc(c.question)}\n期望：${esc((c.expectedBehavior||[]).join('；')||'未填写')}</div><div id="case-result-${esc(c.module)}-${esc(c.id)}"></div></article>`).join('')||'<div class="empty">暂无评测用例</div>'}</div></section>`;$('#caseFilter').value=state.caseFilter}
function renderBatches(){const rows=allBatches();$('#view').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>评测中心</h2><p>对选中的真实 Agent 用例创建回归批次，PASS、FAIL、REVIEW、ERROR 分开统计。</p></div><div class="toolbar"><button class="btn green" data-action="run-batch">运行已选（${state.selected.size}）</button><button class="btn" data-action="refresh">刷新批次</button></div></div><div class="panel-body"><div class="table-wrap"><table><thead><tr><th>批次</th><th>模块</th><th>进度</th><th>结果</th><th>条件</th><th>操作</th></tr></thead><tbody>${rows.map(b=>`<tr><td><strong>${esc(b.name)}</strong><div class="hint">${esc(b.versionLabel||b.id)}</div></td><td>${moduleName(b.module)}</td><td><div>${esc(b.currentIndex??0)} / ${esc(b.total??0)} · ${esc(b.status)}</div><div class="progress"><span style="width:${b.total?Math.round((b.currentIndex||0)/b.total*100):0}%"></span></div></td><td>PASS ${b.passed||0} · FAIL ${b.failed||0} · REVIEW ${b.review||0} · ERROR ${b.errors||0}</td><td>${esc(b.provider)} / ${esc(b.model)}</td><td><button class="btn" data-action="batch-detail" data-module="${b.module}" data-id="${esc(b.id)}">查看结果</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">暂无批次；请先在“评测集”选择用例</td></tr>'}</tbody></table></div><div id="batchDetail" class="result-box" hidden></div></div></section>`}
function renderAnnotations(mode='annotations'){const rows=state.annotations;const pending=rows.filter(x=>x.status==='pending');if(mode==='human'){ $('#view').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>人工评估</h2><p>逐条接管待复核样本，接受或驳回模型结论。</p></div><span class="badge review">待处理 ${pending.length}</span></div><div class="panel-body list">${pending.map(x=>`<article class="row"><div class="row-top"><div><h3>${esc(x.caseId||x.id)}</h3><div class="meta"><span>${esc(x.suite)}</span><span>${esc(x.reviewer||'未分配')}</span></div></div><div class="actions"><button class="btn green" data-action="review-annotation" data-id="${esc(x.id)}" data-status="reviewed">接受</button><button class="btn danger" data-action="review-annotation" data-id="${esc(x.id)}" data-status="rejected">驳回</button></div></div><div class="detail">输入：${esc(x.input)}\n输出：${esc(x.systemOutput)}\n备注：${esc(x.note)}</div></article>`).join('')||'<div class="empty">暂无待人工评估记录</div>'}</div></section>`;return }$('#view').innerHTML=`<div class="split"><section class="panel"><div class="panel-head"><div><h2>数据标注</h2><p>按正确性、相关性、完整性、安全性、语气和总体质量留痕。</p></div><button class="btn" data-action="export-annotations">导出 JSONL</button></div><div class="panel-body"><form id="annotationForm" class="grid-form"><div class="field"><label>用例 / Run ID</label><input name="id" required placeholder="manual-001"/></div><div class="field"><label>标注人</label><input name="reviewer" value="operator"/></div><div class="field span-2"><label>备注</label><textarea name="note" required></textarea></div><div class="field"><label>总体评分（1-5）</label><input name="overall" type="number" min="1" max="5" value="3"/></div><div><button class="btn primary">保存标注</button></div></form></div></section><section class="panel"><div class="panel-head"><div><h2>标注记录</h2><p>${rows.length} 条</p></div></div><div class="panel-body list">${rows.slice(0,30).map(x=>`<div class="row"><h3>${esc(x.caseId||x.id)}</h3><div class="meta"><span>${esc(x.status)}</span><span>总体 ${esc(x.scores?.overall??'-')}</span><span>${esc(x.reviewer||'未分配')}</span></div><div class="detail">${esc(x.note)}</div></div>`).join('')||'<div class="empty">暂无标注</div>'}</div></section></div>`}
function renderImprovements(){const rows=state.improvements;$('#view').innerHTML=`<div class="split"><section class="panel"><div class="panel-head"><div><h2>生成改进建议</h2><p>只生成草案，不会自动覆盖生产 Prompt。</p></div></div><div class="panel-body"><form id="improvementForm" class="grid-form"><div class="field"><label>模块</label><select name="module"><option value="creators">达人检索</option><option value="audit">内容审核</option></select></div><div class="field"><label>Skill ID</label><input name="skillId" required placeholder="creator_semantic_match"/></div><div class="field"><label>来源 Run ID</label><input name="sourceRunId"/></div><div class="field span-2"><label>问题反馈</label><textarea name="feedback" required></textarea></div><div><button class="btn green">生成草案</button></div></form><div id="draft" class="result-box" hidden></div></div></section><section class="panel"><div class="panel-head"><div><h2>改进记录</h2><p>用户确认后再进入 Skill 管理应用。</p></div></div><div class="panel-body list">${rows.map(x=>`<div class="row"><div class="row-top"><div><h3>${esc(x.title)}</h3><div class="meta"><span>${esc(x.source)}</span><span>${esc(x.status)}</span><span>${esc(new Date(x.createdAt).toLocaleString())}</span></div></div></div><div class="detail">${esc(x.detail)}</div></div>`).join('')||'<div class="empty">暂无改进建议</div>'}</div></section></div>`}
function renderVersions(){const modules=['creators','audit'];const blocks=modules.map(m=>{const d=state.admins[m]||{};return `<section class="panel"><div class="panel-head"><div><h2>${moduleName(m)} Skill 版本</h2><p>回滚前会再次保存当前版本快照。</p></div></div><div class="panel-body list">${(d.skills||[]).map(s=>`<div class="row"><div class="row-top"><div><h3>${esc(s.name)}</h3><div class="meta"><span>${esc(s.id)}</span><span>当前 v${esc(s.version)}</span></div></div><button class="btn" data-action="load-versions" data-module="${m}" data-id="${esc(s.id)}">查看版本</button></div><div id="versions-${esc(m)}-${esc(s.id)}"></div></div>`).join('')||'<div class="empty">暂无 Skill</div>'}</div></section>`}).join('');$('#view').innerHTML=`<div class="split">${blocks}</div>`}
function renderAb(){const rows=state.abTests;$('#view').innerHTML=`<div class="split"><section class="panel"><div class="panel-head"><div><h2>Prompt A/B</h2><p>建立实验记录；流量分配和显著性分析需在接通在线实验服务后执行。</p></div></div><div class="panel-body"><form id="abForm" class="grid-form"><div class="field span-2"><label>实验名称</label><input name="name" required/></div><div class="field"><label>模块</label><select name="module"><option value="creators">达人检索</option><option value="audit">内容审核</option></select></div><div class="field"><label>状态</label><select name="status"><option value="draft">草稿</option><option value="running">运行中</option><option value="done">已结束</option></select></div><div class="field span-2"><label>Baseline Prompt</label><textarea name="baseline" required></textarea></div><div class="field span-2"><label>Variant Prompt</label><textarea name="variant" required></textarea></div><div><button class="btn primary">创建实验</button></div></form></div></section><section class="panel"><div class="panel-head"><div><h2>实验列表</h2><p>${rows.length} 个实验</p></div></div><div class="panel-body list">${rows.map(x=>`<div class="row"><h3>${esc(x.name)}</h3><div class="meta"><span>${moduleName(x.module)}</span><span>${esc(x.status)}</span><span>${esc(new Date(x.createdAt).toLocaleString())}</span></div><div class="detail">Baseline：${esc(x.baseline)}\nVariant：${esc(x.variant)}</div></div>`).join('')||'<div class="empty">暂无 A/B 实验</div>'}</div></section></div>`}
async function showTab(tab){state.tab=tab;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.tab===tab)));$('#view').innerHTML='<div class="loading">正在读取数据…</div>';notify('');try{if(!state.modules.creators||!state.modules.audit)await loadCore();await ensure(tab);({cases:renderCases,batches:renderBatches,annotations:()=>renderAnnotations('annotations'),improvements:renderImprovements,human:()=>renderAnnotations('human'),versions:renderVersions,ab:renderAb}[tab]||renderCases)()}catch(e){notify(e.message,'error');$('#view').innerHTML='<div class="empty">数据加载失败，请重试</div>'}}
const casePolling=new Set();
function caseExecution(module,caseId){return (state.modules[module]?.executions||[]).find(item=>item.caseId===caseId)||null}
function storeCaseExecution(module,execution){if(!execution||!state.modules[module])return;const rows=state.modules[module].executions||[];state.modules[module].executions=[...rows.filter(item=>item.caseId!==execution.caseId),execution]}
function syncCaseExecutionUi(){
  for(const c of allCases()){
    const execution=caseExecution(c.module,c.id);
    const button=document.querySelector(`[data-action="run-case"][data-module="${c.module}"][data-id="${CSS.escape(c.id)}"]`);
    const box=document.querySelector(`#case-result-${c.module}-${CSS.escape(c.id)}`);
    if(!button||!box)continue;
    const running=execution?.status==='running';
    button.disabled=running;
    button.textContent=running?'真实测试中…':execution?'重新测试':'测试';
    if(!execution){box.className='';box.textContent='';continue}
    box.className='result-box';
    if(running){box.textContent=`RUNNING · 真实 Agent 任务仍在执行\n开始时间：${new Date(execution.startedAt).toLocaleString()}\n刷新页面不会中断任务，也不能重复启动。`;continue}
    if(execution.status==='error'){box.textContent=`ERROR · ${execution.error||'真实测试执行失败'}`;continue}
    const run=execution.run;
    box.textContent=run?`${run.status} · ${run.reason}\n证据：${(run.evidence||[]).join('；')}\nrunId：${run.agentRunId}${run.error?`\n错误：${run.error}`:''}`:'真实测试已结束，但没有运行结果。';
  }
}
async function pollCaseExecution(module,caseId){
  const key=`${module}:${caseId}`;
  if(casePolling.has(key))return;
  casePolling.add(key);
  try{
    while(caseExecution(module,caseId)?.status==='running'){
      await sleep(2000);
      try{const execution=(await api(`/api/module-eval/${module}/cases/${caseId}/run-state`)).execution;storeCaseExecution(module,execution);if(state.tab==='cases')syncCaseExecutionUi()}catch(error){notify(`执行状态同步失败，将继续重试：${error.message}`,'error')}
    }
  }finally{casePolling.delete(key)}
}
function resumeCaseExecutions(){for(const module of ['creators','audit'])for(const execution of state.modules[module]?.executions||[])if(execution.status==='running')void pollCaseExecution(module,execution.caseId)}
const renderCasesBase=renderCases;
renderCases=function(){renderCasesBase();syncCaseExecutionUi();resumeCaseExecutions()};
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab)});
document.addEventListener('change',e=>{if(e.target.id==='caseFilter'){state.caseFilter=e.target.value;renderCases()}if(e.target.matches('[data-select-case]')){e.target.checked?state.selected.add(e.target.dataset.selectCase):state.selected.delete(e.target.dataset.selectCase)}});
document.addEventListener('submit',async e=>{e.preventDefault();try{if(e.target.id==='ratingForm'){const f=new FormData(e.target);await api('/api/ratings',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});notify('评分已保存');await ensure('ratings');renderRatings()}if(e.target.id==='annotationForm'){const f=new FormData(e.target),n=Number(f.get('overall'));await api('/api/annotations/add',{method:'POST',body:JSON.stringify({annotation:{id:f.get('id'),caseId:f.get('id'),reviewer:f.get('reviewer'),suite:'manual',note:f.get('note'),scores:{correctness:n,relevance:n,completeness:n,safety:n,tone:n,overall:n}}})});notify('标注已保存');await ensure('annotations');renderAnnotations()}if(e.target.id==='improvementForm'){const body=Object.fromEntries(new FormData(e.target));const d=await api('/api/improvements/generate-prompt',{method:'POST',body:JSON.stringify(body)});$('#draft').hidden=false;$('#draft').textContent=d.draft;notify('改进草案已生成，尚未应用');await ensure('improvements')}if(e.target.id==='abForm'){await api('/api/ab-tests',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});notify('A/B 实验记录已创建');await ensure('ab');renderAb()}}catch(err){notify(err.message,'error')}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;try{if(action==='refresh'){state.modules={creators:null,audit:null};await loadCore();await showTab(state.tab);notify('数据已刷新');return}if(action==='new-case'){openCase();return}if(action==='select-first'){allCases().filter(x=>x.enabled).slice(0,3).forEach(x=>state.selected.add(`${x.module}::${x.id}`));renderCases();return}if(action==='edit-case'){openCase(allCases().find(x=>x.module===b.dataset.module&&x.id===b.dataset.id));return}if(action==='copy-case'){const c=allCases().find(x=>x.module===b.dataset.module&&x.id===b.dataset.id);const copy={...c,id:`${c.id}-copy-${Date.now().toString().slice(-4)}`,name:`${c.name}（副本）`,source:'manual'};await api(`/api/module-eval/${c.module}/cases`,{method:'POST',body:JSON.stringify(copy)});await loadCore();renderCases();notify('用例已复制');return}if(action==='toggle-case'){await api(`/api/module-eval/${b.dataset.module}/cases/${b.dataset.id}`,{method:'PATCH',body:JSON.stringify({enabled:b.dataset.enabled!=='true'})});await loadCore();renderCases();notify('启用状态已更新');return}if(action==='delete-case'){if(!confirm('确定删除这条评测用例？'))return;await api(`/api/module-eval/${b.dataset.module}/cases/${b.dataset.id}`,{method:'DELETE'});await loadCore();renderCases();notify('用例已删除');return}if(action==='run-case'){b.disabled=true;b.textContent='真实测试中…';let execution=(await api(`/api/module-eval/${b.dataset.module}/cases/${b.dataset.id}/run`,{method:'POST'})).execution;while(execution.status==='running'){await sleep(2000);execution=(await api(`/api/module-eval/${b.dataset.module}/cases/${b.dataset.id}/run-state`)).execution}if(execution.status==='error')throw new Error(execution.error||'真实测试执行失败');const run=execution.run;if(!run)throw new Error('真实测试结束但未返回运行结果');const box=$(`#case-result-${b.dataset.module}-${CSS.escape(b.dataset.id)}`);box.className='result-box';box.textContent=`${run.status} · ${run.reason}\n证据：${(run.evidence||[]).join('；')}\nrunId：${run.agentRunId}${run.error?`\n错误：${run.error}`:''}`;b.disabled=false;b.textContent='测试';notify(run.status==='ERROR'?run.reason:'真实系统单条评测完成',run.status==='ERROR'?'error':'');return}if(action==='run-batch'){if(!state.selected.size)throw new Error('请先在“评测集”选择至少一条用例');const grouped={creators:[],audit:[]};state.selected.forEach(k=>{const [m,id]=k.split('::');grouped[m].push(id)});for(const m of ['creators','audit'])if(grouped[m].length)await api(`/api/module-eval/${m}/batches`,{method:'POST',body:JSON.stringify({name:`${moduleName(m)}回归-${new Date().toLocaleString()}`,versionLabel:'ops-real-system',caseIds:grouped[m]})});await loadCore();renderBatches();notify('真实系统评测批次已创建，可手动刷新查看进度');return}if(action==='batch-detail'){const d=await api(`/api/module-eval/${b.dataset.module}/batches/${b.dataset.id}`);const box=$('#batchDetail');box.hidden=false;box.textContent=`批次 ${d.batch.name}\n状态：${d.batch.status}\n${(d.runs||[]).map(r=>`${r.status} · ${r.question}\n${r.reason}\nrunId=${r.agentRunId}`).join('\n\n')||'暂无结果'}`;box.scrollIntoView({behavior:'smooth',block:'nearest'});return}if(action==='export-annotations'){const d=await api('/api/export?filter=all');const url=URL.createObjectURL(new Blob([d.jsonl],{type:'application/jsonl'}));const a=document.createElement('a');a.href=url;a.download='adproof-annotations.jsonl';a.click();URL.revokeObjectURL(url);return}if(action==='review-annotation'){const item=state.annotations.find(x=>x.id===b.dataset.id);await api('/api/annotations/save',{method:'POST',body:JSON.stringify({annotations:[{...item,status:b.dataset.status}]})});await ensure('human');renderAnnotations('human');notify('人工评估状态已保存');return}if(action==='load-versions'){const d=await api(`/api/module-admin/${b.dataset.module}/skills/${b.dataset.id}/versions`);const box=$(`#versions-${b.dataset.module}-${CSS.escape(b.dataset.id)}`);box.className='detail';box.innerHTML=(d.versions||[]).map(v=>`<div class="row-top"><span>${esc(v.id)} · v${esc(v.version)} · ${esc(v.changeNote)}</span><button class="btn danger" data-action="restore-version" data-module="${b.dataset.module}" data-skill="${esc(b.dataset.id)}" data-version="${esc(v.id)}">回滚</button></div>`).join('')||'暂无历史版本';return}if(action==='restore-version'){if(!confirm('确定回滚到这个 Skill 版本？系统会先保存当前版本快照。'))return;await api(`/api/module-admin/${b.dataset.module}/skills/${b.dataset.skill}/versions/${b.dataset.version}/restore`,{method:'POST'});notify('Skill 已回滚并保留原版本快照');await ensure('versions');renderVersions();return}}catch(err){b.disabled=false;if(action==='run-case')b.textContent='测试';notify(err.message,'error')}});
function openCase(c=null){const d=$('#caseDialog'),f=$('#caseForm');f.reset();$('#caseDialogTitle').textContent=c?'编辑评测用例':'新增评测用例';if(c){for(const [k,v] of Object.entries({originalId:c.id,module:c.module,id:c.id,name:c.name,question:c.question,category:c.category,difficulty:c.difficulty,minimumPersistedCount:c.minimumPersistedCount??(c.module==='creators'?20:0),expectedBehavior:(c.expectedBehavior||[]).join('\n'),keywords:(c.expectedKeywords?.all||[]).join(','),forbiddenWords:(c.forbiddenWords||[]).join(',')})){if(f.elements[k])f.elements[k].value=v}}d.showModal()}
$('#caseForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),module=f.get('module'),original=f.get('originalId');const current=allCases().find(x=>x.module===module&&x.id===original);const body={...(current||{}),id:String(f.get('id')).trim(),module,name:String(f.get('name')).trim(),question:String(f.get('question')).trim(),category:String(f.get('category')).trim(),difficulty:f.get('difficulty'),riskLevel:current?.riskLevel||'low',minimumPersistedCount:module==='creators'?Number(f.get('minimumPersistedCount')):undefined,expectedBehavior:String(f.get('expectedBehavior')).split('\n').map(x=>x.trim()).filter(Boolean),expectedKeywords:{all:String(f.get('keywords')).split(',').map(x=>x.trim()).filter(Boolean)},forbiddenWords:String(f.get('forbiddenWords')).split(',').map(x=>x.trim()).filter(Boolean),requiredCapabilities:current?.requiredCapabilities||[],forbiddenCapabilities:current?.forbiddenCapabilities||[],evalDimensions:current?.evalDimensions||['correctness'],enabled:current?.enabled??true,source:current?.source||'manual'};try{if(original)await api(`/api/module-eval/${module}/cases/${original}`,{method:'PATCH',body:JSON.stringify(body)});else await api(`/api/module-eval/${module}/cases`,{method:'POST',body:JSON.stringify(body)});$('#caseDialog').close();await loadCore();renderCases();notify('评测用例已保存')}catch(err){notify(err.message,'error')}});
document.addEventListener('click',async e=>{
  const button=e.target.closest('[data-action="run-case"]');
  if(!button)return;
  e.preventDefault();
  e.stopImmediatePropagation();
  const module=button.dataset.module,caseId=button.dataset.id;
  if(caseExecution(module,caseId)?.status==='running'){syncCaseExecutionUi();return}
  button.disabled=true;
  button.textContent='真实测试中…';
  try{
    const execution=(await api(`/api/module-eval/${module}/cases/${caseId}/run`,{method:'POST'})).execution;
    storeCaseExecution(module,execution);
    renderCases();
    void pollCaseExecution(module,caseId);
  }catch(error){button.disabled=false;button.textContent='测试';notify(error.message,'error')}
},true);
showTab('cases');
</script>
</body>
