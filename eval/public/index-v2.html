<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eval 评测中心</title>
<style>
:root{--ink:#171512;--muted:#746d65;--line:#e8e1db;--soft:#f7f4f1;--paper:#fff;--orange:#f45112;--orange-soft:#fff0e8;--green:#079455;--green-soft:#e9f9f0;--amber:#a16207;--amber-soft:#fff7df;--red:#c02626;--red-soft:#fff0f0;--shadow:0 10px 34px rgba(70,45,25,.06)}
*{box-sizing:border-box}body{margin:0;background:#fcfbfa;color:var(--ink);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(244,81,18,.2);outline-offset:1px}
.shell{max-width:1530px;margin:auto;padding:14px 22px 42px}.top{display:flex;justify-content:space-between;gap:22px;border-bottom:1px solid var(--line);padding-bottom:25px}.eyebrow{color:var(--orange);font-weight:650}.top h1{font-size:30px;line-height:1.1;margin:7px 0 8px;letter-spacing:-.04em}.top p{color:var(--muted);font-size:18px;margin:0}.stats{display:flex;gap:9px;padding-top:35px}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:#fff;color:#4c4640;font-size:13px}.badge.ok{color:var(--green);background:var(--green-soft);border-color:#c9edd7}.tabs{display:flex;gap:2px;background:#f1efed;border-radius:7px;width:max-content;padding:4px;margin:26px 0 21px}.tabs button{border:0;background:transparent;color:#665f59;padding:9px 20px;border-radius:6px;font-size:16px}.tabs button.active{background:#fff;box-shadow:0 1px 3px #0002;color:var(--ink);font-weight:650}.notice{padding:10px 13px;background:var(--red-soft);border:1px solid #f2c6c6;color:var(--red);border-radius:7px;margin-bottom:14px}
.case-grid{display:grid;grid-template-columns:350px minmax(0,1fr);min-height:650px;border:1px solid var(--line);border-radius:9px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}.case-side{border-right:1px solid var(--line);min-width:0}.filters{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:9px}.search{height:44px;display:flex;align-items:center;gap:9px;border:1px solid #ded9d4;border-radius:8px;padding:0 13px}.search span{color:#aaa;font-size:20px}.search input{border:0;outline:0;width:100%;min-width:0}.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.filter-row select,.field input,.field select,.field textarea{border:1px solid #ded9d4;border-radius:7px;background:#fff;color:var(--ink);padding:10px 12px;min-width:0}.filter-row select,.field input,.field select{height:42px}.check{display:flex;align-items:center;gap:7px;color:#615a53;font-size:13px}.check input{accent-color:var(--orange)}
.btn{border:1px solid transparent;border-radius:7px;height:40px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:650;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--orange);color:#fff}.btn.primary:hover{background:#da420a}.btn.dark{background:#1b1917;color:#fff}.btn.outline{background:#fff;color:#4b4640;border-color:#d9d3cd}.btn.ghost{background:transparent;color:#625b55}.btn.danger{background:#fff;color:var(--red);border-color:#f2c6c6}.btn.full{width:100%}.case-list{max-height:570px;overflow:auto;padding:7px}.case-item{width:100%;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;gap:11px;text-align:left;padding:14px 12px}.case-item:hover{background:#faf6f2}.case-item.active{background:var(--orange-soft)}.dot{width:9px;height:9px;border-radius:50%;background:#c5c0bb;flex:none}.dot.on{background:#0aa35d}.case-copy{min-width:0;flex:1}.case-name{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.case-meta{display:block;margin-top:5px;color:#817a72;font-size:12px}.chev{color:#a49d96;font-size:19px}
.detail{min-width:0}.panel-head,.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:22px 25px 18px}.panel-head h2,.card-head h2{font-size:20px;margin:0 0 5px;letter-spacing:-.02em}.panel-head p,.card-head p{margin:0;color:var(--muted);font-size:13px}.detail-body,.card-body{padding:23px 25px;display:grid;gap:20px}.actions{display:flex;flex-wrap:wrap;gap:8px}.field{display:grid;gap:7px}.field label{font-size:13px;color:#625b55}.field textarea{min-height:105px;resize:vertical;line-height:1.55}.field textarea.mini{min-height:75px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border-radius:999px;background:#f5f2ef;padding:5px 9px;color:#5e5750;font-size:12px}.chip.orange{background:var(--orange-soft);color:#b93808}.mono{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:7px;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6}.empty{display:grid;place-items:center;min-height:300px;color:var(--muted);text-align:center;padding:30px}.empty strong{display:block;color:#4b4540;font-size:16px;margin-bottom:8px}.card{border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:var(--shadow)}.card-head{padding:19px 22px}.card-head h2{font-size:18px}.card-body{padding:22px}.run-wrap,.results-wrap{display:grid;gap:16px}.run-select{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{padding:13px 14px;border:1px solid var(--line);border-radius:7px;background:#fff}.metric strong{display:block;font-size:23px}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:12px}.metric.pass strong{color:var(--green)}.metric.fail strong{color:var(--red)}.metric.review strong{color:var(--amber)}.progress{height:8px;border-radius:99px;background:#eee9e4;overflow:hidden}.progress i{display:block;height:100%;background:var(--orange)}.table-wrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:760px;text-align:left}.table th{font-size:12px;font-weight:600;color:#777069;background:#faf8f6}.table th,.table td{padding:13px 14px;border-bottom:1px solid #eeeae6;vertical-align:top}.status{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:650}.PASS{background:var(--green-soft);color:var(--green)}.FAIL{background:var(--red-soft);color:var(--red)}.REVIEW{background:var(--amber-soft);color:var(--amber)}.ERROR{background:#27231f;color:#fff}.batch-list{display:grid;gap:7px}.batch-row{border:1px solid var(--line);background:#fff;border-radius:7px;padding:14px 15px;display:grid;grid-template-columns:minmax(0,1fr) repeat(5,auto);gap:17px;align-items:center;text-align:left}.batch-row:hover,.batch-row.selected{border-color:#f3b79e;background:#fffaf7}.batch-row small{display:block;margin-top:4px;color:var(--muted)}.count{font-weight:700}.count.pass{color:var(--green)}.count.fail{color:var(--red)}.count.review{color:var(--amber)}.muted{color:var(--muted)}.footer{margin-top:20px;color:#8c857e;font-size:12px}
@media(max-width:920px){.shell{padding:12px 14px 30px}.top{display:block}.stats{padding-top:18px}.case-grid{grid-template-columns:1fr}.case-side{border-right:0;border-bottom:1px solid var(--line)}.case-list{max-height:280px}.three{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.batch-row{grid-template-columns:minmax(0,1fr) repeat(2,auto)}.batch-row .extra{display:none}}@media(max-width:580px){.top h1{font-size:26px}.top p{font-size:15px}.tabs{width:100%}.tabs button{flex:1;padding:9px 8px;font-size:14px}.two,.run-select{grid-template-columns:1fr}.panel-head,.detail-body,.card-body{padding:17px}.metrics{grid-template-columns:1fr 1fr}.batch-row{grid-template-columns:1fr 1fr}}
</style></head><body><div class="shell"><header class="top"><div><div class="eyebrow">Agent 质量验证</div><h1>Eval 评测中心</h1><p>每次测试调用生产同源 Agent 链路，再依据本次回复与 Trace 评分。</p></div><div class="stats" id="stats"></div></header><nav class="tabs"><button data-tab="cases" class="active">评测集</button><button data-tab="run">单条测试</button><button data-tab="results">批次与结果</button></nav><div id="notice" class="notice" hidden></div><main id="view"></main><div class="footer">本地 Eval 仅用于研发验证；未人工核验的样本不会计入通过。</div></div><script>
