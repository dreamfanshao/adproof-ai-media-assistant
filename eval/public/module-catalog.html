<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据中心</title><link rel="stylesheet" href="/module.css"></head><body><div class="app"><aside class="rail"><div class="brand"><i class="brand-mark"></i><span><strong>媒介助手</strong><small>DATA CENTER</small></span></div><div class="module-label">产品模块</div><nav id="railNav"></nav><div class="rail-footer"><strong>服务端数据摘要</strong><br>只读展示，不允许浏览器直接写入 JSON。</div></aside><section class="workspace"><header class="topbar"><div class="title"><h1 id="pageTitle">数据中心</h1><p id="pageSubtitle">读取模块数据摘要…</p></div><div class="context" id="context"></div></header><main class="content"><div class="module-stripe"></div><div id="notice" class="notice"></div><div id="view"><div class="loading">正在读取数据…</div></div></main></section></div><script>
const moduleId=location.pathname.split("/").filter(Boolean).pop()==="audit"?"audit":"creators",isCreator=moduleId==="creators",moduleName=isCreator?"达人检索":"内容审核",accent=isCreator?"creator":"audit",$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
async function api(path){const r=await fetch(path,{cache:"no-store"}),b=await r.json();if(!r.ok)throw Error(b?.data?.error||"请求失败");return b.data}
function render(admin,evalData){$("pageTitle").textContent=`${moduleName}数据中心`;$(("pageSubtitle")).textContent="Skill、Tool、评测集和批次使用同一套服务端数据摘要。";$(("context")).innerHTML=`<a href="/admin/${moduleId}">后台</a><a href="/eval/${moduleId}">Eval</a>`;$("railNav").innerHTML=`<a href="http://127.0.0.1:5173/${isCreator?"creators":"audit/new"}">返回业务系统</a><a href="/admin/${moduleId}">${moduleName}后台</a><a href="/eval/${moduleId}">${moduleName} Eval</a><a href="/models/${moduleId}">模型管理</a><a href="/ops/${moduleId}">运营中心</a><a class="active ${accent}-active" href="/catalog/${moduleId}">数据中心</a>`;$("view").innerHTML=`<section class="summary"><div class="metric"><span>Skills</span><strong>${admin.metrics.enabledSkills}/${admin.metrics.skills}</strong><em>启用 / 总数</em></div><div class="metric"><span>Tools</span><strong>${admin.metrics.enabledTools}/${admin.metrics.tools}</strong><em>启用 / 总数</em></div><div class="metric"><span>评测用例</span><strong>${evalData.cases.length}</strong><em>启用 ${evalData.enabledCases.length} 条</em></div><div class="metric"><span>批次</span><strong>${evalData.batches.length}</strong><em>本模块历史</em></div></section><section class="section"><div class="section-head"><div><h2>能力目录</h2><p>当前模块可被 Planner 选择的服务端 Skill 与 Tool。</p></div></div><div class="section-body cards">${admin.skills.map(x=>`<article class="skill-card"><h3>${esc(x.name)}</h3><span class="chip ${accent}">${esc(x.id)}</span><p>${esc(x.description)}</p><span class="status ${x.enabled?"on":"off"}">${x.enabled?"已启用":"已停用"}</span></article>`).join("")}${admin.tools.map(x=>`<article class="skill-card"><h3>${esc(x.name)}</h3><span class="chip ${accent}">${esc(x.id)}</span><p>${esc(x.description)}</p><span class="status ${x.enabled?"on":"off"}">${x.enabled?"已启用":"已停用"}</span></article>`).join("")}</div></section><section class="section"><div class="section-head"><div><h2>评测数据</h2><p>批次结果由真实 Agent Trace 生成，详情请进入 Eval。</p></div><a class="btn ${accent}" href="/eval/${moduleId}">打开 Eval</a></div><div class="section-body table-wrap"><table class="table"><thead><tr><th>批次</th><th>状态</th><th>用例数</th><th>PASS</th><th>FAIL</th><th>REVIEW</th><th>ERROR</th></tr></thead><tbody>${evalData.batches.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.id)}</small></td><td><span class="status ${x.status===`done`?`PASS`:`REVIEW`}">${esc(x.status)}</span></td><td>${x.total}</td><td>${x.passed}</td><td>${x.failed}</td><td>${x.review}</td><td>${x.errors}</td></tr>`).join("")||`<tr><td colspan="7">暂无批次数据</td></tr>`}</tbody></table></div></section>`}
Promise.all([api(`/api/module-admin/${moduleId}`),api(`/api/module-eval/${moduleId}`)]).then(([admin,evalData])=>render(admin,evalData)).catch(e=>{$("notice").textContent=e.message;$("notice").className="notice show"});
</script><script>
(()=>{const path=location.pathname,mod=path.split('/').filter(Boolean).pop()==='audit'?'audit':'creators',isC=mod==='creators',name=isC?'达人检索':'内容审核',accent=isC?'creator':'audit';const c=document.getElementById('context');if(c){c.className='global-tabs';c.innerHTML=[['/agent/'+mod,'Agent 控制台'],['/admin/'+mod+'?focus=skills','Skills'],['/admin/'+mod+'?focus=tools','Tools'],['/planner/'+mod,'Planner'],['/models/'+mod,'模型管理'],['/ops/'+mod,'运营中心'],['/catalog/'+mod,'数据中心']].map(([h,l])=>`<a href="${h}" class="${location.pathname===h?'active':''}">${l}</a>`).join('')}const rail=document.getElementById('railNav');if(rail){const extra=[['/agent/'+mod,name+' Agent'],['/planner/'+mod,'Planner 管理']];extra.forEach(([h,l])=>{if(![...rail.querySelectorAll('a')].some(a=>a.getAttribute('href')===h)){const a=document.createElement('a');a.href=h;a.textContent=l;rail.appendChild(a)}})}})();
</script></body></html>
