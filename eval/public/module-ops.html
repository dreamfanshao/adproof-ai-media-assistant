<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eval 评测中心</title>
<style>
:root{--ink:#14233b;--muted:#647791;--line:#d9e3ef;--bg:#f5f8fb;--brand:#315ee8;--green:#0f8f7a;--orange:#c26b18;--red:#b53a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.topbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:28px;min-height:72px;padding:14px clamp(18px,4vw,56px);background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:19px;white-space:nowrap}.mark{display:inline-block;width:14px;height:14px;margin-right:10px;background:linear-gradient(135deg,#315ee8,#7e9bff);border-radius:3px;transform:rotate(45deg)}.main-nav,.module-tabs,.workspace-tabs{display:flex;gap:7px;flex-wrap:wrap}.main-nav a,.module-tabs a,.workspace-tabs button{border:1px solid var(--line);border-radius:9px;padding:9px 14px;background:#fff;color:#536982;font-weight:700;cursor:pointer}.main-nav a.active,.module-tabs a.active,.workspace-tabs button.active{background:#e7efff;border-color:#8eafff;color:var(--brand)}.page{width:min(1480px,100%);margin:auto;padding:28px clamp(18px,4vw,56px) 60px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.eyebrow{font-size:11px;letter-spacing:.15em;color:#71849b;font-weight:800}.head h1{font-size:32px;margin:8px 0 5px;letter-spacing:-.04em}.head p{margin:0;color:var(--muted)}.badge,.chip{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;background:#edf3ff;color:var(--brand);font-size:12px;font-weight:700}.badge.ok{background:#e5f7f0;color:#14765f}.badge.warn{background:#fff3dc;color:#9a6415}.module-tabs{margin-top:24px}.module-tabs a{padding:11px 22px}.module-tabs a.active{background:#e4f7f1;border-color:#0f8f7a;color:#087764}.workspace-tabs{margin-top:14px;padding:7px;background:#edf2f8;border:1px solid var(--line);border-radius:12px}.workspace-tabs button{border:0;background:transparent}.workspace-tabs button.active{background:#fff;border:1px solid #a6bbef}.notice{display:none;margin-top:16px;padding:12px 15px;border-radius:10px;background:#eef3fa;color:#405a78;border:1px solid var(--line)}.notice.show{display:block}.notice.ok{background:#e7f8f0;color:#176e56;border-color:#b8e3d2}.notice.error{background:#fff0f0;color:#a33838;border-color:#efcaca}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.metric,.panel,.case-card{background:#fff;border:1px solid var(--line);border-radius:14px}.metric{padding:17px}.metric span,.metric em{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:28px;margin:6px 0}.metric em{font-style:normal;font-size:12px;color:#187458}.panel{padding:22px;margin-top:16px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:16px}.panel h2{font-size:20px;margin:0 0 6px}.panel h3{font-size:16px;margin:0 0 7px}.panel p{color:var(--muted);line-height:1.6;margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid transparent;border-radius:9px;padding:9px 14px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.secondary{background:#fff;color:#31506f;border-color:var(--line)}.btn.danger{background:#fff1f1;color:var(--red);border-color:#f0cccc}.btn:disabled{opacity:.55;cursor:not-allowed}.case-list{display:grid;gap:12px}.case-card{padding:16px}.case-card header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.case-card h3{margin:0 0 8px;font-size:16px}.case-card .question{color:#223f61;margin:9px 0}.case-card .meta{font-size:13px;color:var(--muted);line-height:1.8}.chip{margin:0 5px 5px 0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;text-align:left;vertical-align:top;border-bottom:1px solid #e8eef5}.table th{color:var(--muted);font-size:12px;white-space:nowrap}.status{font-weight:800}.status.PASS{color:#16815f}.status.FAIL{color:#b53a3a}.status.REVIEW{color:#a46b12}.status.ERROR{color:#a12f7e}.empty{padding:32px;text-align:center;color:#7b8da3}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:700;font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid #cfdbea;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);font:inherit}.field textarea{min-height:110px;resize:vertical}.mono{white-space:pre-wrap;background:#f7f9fc;border:1px solid #e6edf5;border-radius:8px;padding:12px;max-height:430px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.evidence{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fbfcfe}.evidence b{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.skill-list,.tool-list{display:grid;gap:10px}.skill-row,.tool-row{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}.skill-row.active,.tool-row.active{border-color:#8eafff;background:#f4f7ff}.skill-row strong,.tool-row strong{display:block}.skill-row small,.tool-row small{color:var(--muted)}.toggle{float:right}.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.side{max-height:520px;overflow:auto}.side .skill-row,.side .tool-row{margin-bottom:8px}.kpi-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.kpi{padding:15px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px}.kpi strong{display:block;font-size:24px;margin-top:5px}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2,.evidence-grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-wrap:wrap}.main-nav{width:100%}}@media(max-width:520px){.metrics{grid-template-columns:1fr}.page{padding:20px 14px 40px}.head{display:block}.head .badge{margin-top:13px}.workspace-tabs button,.module-tabs a{flex:1;text-align:center}}
</style>
</head>
<body><div class="shell"><header class="topbar"><a href="/" class="brand"><i class="mark"></i>媒介助手</a><nav class="main-nav"><a href="/">后台管理</a><a href="/eval/creators" class="active">Eval</a></nav></header><main class="page"><header class="head"><div><div class="eyebrow">ADPROOF WORKSPACE · LOCAL QUALITY LAB</div><h1>Eval 评测中心</h1><p>同一套 Agent 链路、Skills、Tools 与 Planner，分别评测达人检索与内容审核。</p></div><span class="badge" id="runtime">正在加载运行模式</span></header><nav class="module-tabs"><a href="/eval/creators" id="creatorTab">达人检索 Eval</a><a href="/eval/audit" id="auditTab">内容审核 Eval</a></nav><nav class="workspace-tabs" id="workspaceTabs"></nav><div id="notice" class="notice"></div><section id="metrics" class="metrics"></section><section id="view"></section></main></div>
<script>
const moduleId=location.pathname.includes("/audit")?"audit":"creators";
const moduleName=moduleId==="creators"?"达人检索":"内容审核";
const apiBase="/api/module-eval/"+moduleId;
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let state={data:null,tab:location.hash.slice(1)||"cases",selected:new Set(),caseId:"",run:null,batchId:"",skillId:"",toolId:"",admin:null,planner:null,model:null};
const tabs=[["cases","评测集"],["single","单条测试"],["batches","批次与结果"],["skills","Skills"],["tools","Tools"],["planner","Planner"],["model","模型管理"],["ops","运营中心"]];
function show(text,type=""){const n=$("notice");n.textContent=text;n.className="notice show "+type}
function clearNotice(){$("notice").className="notice"}
async function get(path,opt={}){const r=await fetch(path,{cache:"no-store",...opt});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b?.data?.error||b?.error||("请求失败 HTTP "+r.status));return b.data||b}
function statusClass(s){return s==="PASS"?"PASS":s==="FAIL"?"FAIL":s==="ERROR"?"ERROR":"REVIEW"}
function caseMeta(c){return '<span class="chip">'+esc(c.category||"未分类")+'</span><span class="chip">'+esc(c.difficulty||"未设置")+'</span><span class="chip">风险：'+esc(c.riskLevel||"未设置")+'</span><span class="chip">维度：'+esc((c.evalDimensions||[]).join(" / ")||"规则")+'</span>'}
function renderResult(r,c){return '<section class="panel"><div class="panel-head"><div><h3>测试结果 · '+esc(c?.name||r.caseId)+'</h3><p>Run ID：'+esc(r.agentRunId||r.id)+' · '+esc(r.provider||"")+' / '+esc(r.model||"")+' · '+(r.durationMs||0)+' ms</p></div><span class="status '+statusClass(r.status)+'">'+esc(r.status)+'</span></div><div class="evidence-grid"><div class="evidence"><b>判定原因</b>'+esc(r.reason||"未提供")+'</div><div class="evidence"><b>Agent 状态</b>'+esc(r.agentStatus||"未知")+'</div><div class="evidence"><b>关键词命中</b>'+esc((r.keywordHits||[]).join("、")||"无")+'</div><div class="evidence"><b>关键词缺失</b>'+esc((r.keywordMisses||[]).join("、")||"无")+'</div><div class="evidence"><b>禁词命中</b>'+esc((r.forbiddenHits||[]).join("、")||"无")+'</div><div class="evidence"><b>能力命中 / 缺失</b>'+esc((r.capabilityHits||[]).join("、")||"无")+' / '+esc((r.capabilityMisses||[]).join("、")||"无")+'</div><div class="evidence"><b>风险问题</b>'+esc((r.riskIssues||[]).join("、")||"无")+'</div><div class="evidence"><b>数据源 / 分析方式</b>'+esc(r.dataSource||"")+' / '+esc(r.analysisMode||"")+'</div></div><div class="evidence" style="margin-top:16px"><b>核验标准</b><br>规则评测逐项对照期望行为、关键词组、禁词、必需能力与风险预期；以下证据、Trace 和实际输出均来自本次 Agent 运行。</div><h3 style="margin-top:18px">实际输出</h3><pre class="mono">'+esc(r.actual||"")+'</pre><h3 style="margin-top:18px">证据链与 Trace</h3><pre class="mono">'+esc(JSON.stringify({evidence:r.evidence,trace:r.trace},null,2))+'</pre></section>'}
function viewCases(){const d=state.data;const cards=(d.cases||[]).map(c=>'<article class="case-card"><header><div><h3><label><input type="checkbox" data-case="'+esc(c.id)+'" '+(state.selected.has(c.id)?"checked":"")+' '+(!c.enabled?"disabled":"")+'> '+esc(c.name)+'</label></h3>'+caseMeta(c)+'</div><div class="actions"><button class="btn secondary" data-test="'+esc(c.id)+'">单条测试</button><button class="btn secondary" data-copy="'+esc(c.id)+'">复制</button><button class="btn '+(c.enabled?"danger":"green")+'" data-toggle="'+esc(c.id)+'">'+(c.enabled?"停用":"启用")+'</button></div></header><p class="question">'+esc(c.question)+'</p><div class="meta"><b>期望行为：</b>'+esc((c.expectedBehavior||[]).join("；")||"未填写")+'<br><b>关键词：</b>ALL ['+esc((c.expectedKeywords?.all||[]).join("、"))+'] ANY ['+esc((c.expectedKeywords?.any||[]).join("、"))+']<br><b>禁词：</b>'+esc((c.forbiddenWords||[]).join("、")||"无")+'<br><b>能力约束：</b>'+esc((c.requiredCapabilities||[]).join("、")||"无")+'</div></article>').join("")||'<div class="empty">暂无评测用例</div>';return '<section class="panel"><div class="panel-head"><div><h2>'+moduleName+'评测集</h2><p>每条用例定义期望行为、关键词组、禁词、必需能力和风险预期，可单条测试并核验完整证据。</p></div><div class="actions"><button class="btn secondary" id="selectThree">选择前 3 条</button><button class="btn" id="runSelected">运行已选（'+state.selected.size+'）</button></div></div><div class="case-list">'+cards+'</div><div class="actions" style="margin-top:16px"><button class="btn secondary" id="newCase">+ 新增用例</button></div><div id="caseForm"></div></section>'}function viewSingle(){const d=state.data,c=(d.cases||[]).find(x=>x.id===state.caseId)||(d.cases||[])[0];return '<section class="panel"><div class="panel-head"><div><h2>单条测试</h2><p>测试调用真实 Agent 链路；模型未配置时显示 ERROR/REVIEW，不伪装成 PASS。</p></div><button class="btn" id="runOne">运行此用例</button></div><div class="field"><label>选择测试用例</label><select id="caseSelect">'+(d.cases||[]).map(x=>'<option value="'+esc(x.id)+'" '+(x.id===c?.id?"selected":"")+'>'+esc(x.name)+' · '+esc(x.question)+'</option>').join("")+'</select></div>'+(state.run?renderResult(state.run,c):'<div class="empty">请选择用例并运行，结果会在此处展示完整核验依据。</div>')+'</section>'}
function viewBatches(){const d=state.data,b=(d.batches||[]).find(x=>x.id===state.batchId)||(d.batches||[])[0];return '<section class="panel"><div class="panel-head"><div><h2>批次与结果</h2><p>批次只运行选择的 caseIds；total = PASS + FAIL + REVIEW + ERROR，ERROR 不进入质量通过率。</p></div><div class="actions"><button class="btn" id="runAll">运行全部启用用例</button><button class="btn secondary" id="compare">比较最近两批次</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>批次</th><th>状态</th><th>用例数</th><th>PASS / FAIL / REVIEW / ERROR</th><th>评测器</th></tr></thead><tbody>'+(d.batches||[]).map(x=>'<tr><td><button class="btn secondary" data-batch="'+esc(x.id)+'">'+esc(x.name)+'</button><br><small>'+esc(x.versionLabel||"")+'</small></td><td><span class="status '+statusClass(x.status==="done"?"PASS":x.status==="error"?"ERROR":"REVIEW")+'">'+esc(x.status)+'</span></td><td>'+x.total+'</td><td>'+x.passed+' / '+x.failed+' / '+x.review+' / '+x.errors+'</td><td>'+esc(x.evaluatorVersion||"")+'</td></tr>').join("")||'<tr><td colspan="5" class="empty">暂无批次</td></tr>'+'</tbody></table></div><div id="batchDetail">'+(b?'<div class="empty">正在读取批次详情…</div>':'<div class="empty">暂无批次</div>')+'</div><div id="compareResult"></div></section>'}
function viewSkills(){const a=state.admin;return '<section class="panel"><div class="panel-head"><div><h2>Skills 管理</h2><p>每个业务步骤封装为独立 Skill，明确适用场景、不适用场景、输入和输出契约。</p></div><button class="btn" id="reloadAdmin">刷新</button></div>'+(a?'<div class="split"><div class="side skill-list">'+a.skills.map(s=>'<div class="skill-row '+(state.skillId===s.id?"active":"")+'" data-skill="'+esc(s.id)+'"><label><input class="toggle" type="checkbox" data-skill-toggle="'+esc(s.id)+'" '+(s.enabled?"checked":"")+'> <strong>'+esc(s.name)+'</strong><small>'+esc(s.id)+' · v'+s.version+' · '+(s.enabled?"启用":"停用")+'</small></label></div>').join("")+'</div><div>'+skillEditor()+'</div></div>':'<div class="empty">正在读取 Skills…</div>')+'</section>'}
function skillEditor(){const s=(state.admin?.skills||[]).find(x=>x.id===state.skillId)||state.admin?.skills?.[0];if(!s)return '<div class="empty">暂无 Skill</div>';state.skillId=s.id;return '<form id="skillForm"><h3>'+esc(s.name)+' <small>'+esc(s.id)+'</small></h3><div class="field"><label>名称</label><input name="name" value="'+esc(s.name)+'"></div><div class="field"><label>描述</label><textarea name="description">'+esc(s.description||"")+'</textarea></div><div class="grid-2"><div class="field"><label>适用场景（每行一条）</label><textarea name="useWhen">'+esc((s.useWhen||[]).join("\n"))+'</textarea></div><div class="field"><label>不适用场景（每行一条）</label><textarea name="notFor">'+esc((s.notFor||[]).join("\n"))+'</textarea></div></div><div class="field"><label>Prompt</label><textarea name="prompt" style="min-height:190px">'+esc(s.prompt||"")+'</textarea></div><p>当前版本 v'+s.version+' · 模型 '+esc(s.model||"默认")+' · 温度 '+s.temperature+'</p><div class="actions"><button class="btn" type="submit">保存并创建快照</button><button class="btn secondary" type="button" id="versions">查看版本</button></div><pre class="mono" id="versionBox"></pre></form>'}
function viewTools(){const a=state.admin,t=(a?.tools||[]).find(x=>x.id===state.toolId)||a?.tools?.[0];if(a&&!state.toolId&&t)state.toolId=t.id;return '<section class="panel"><div class="panel-head"><div><h2>Tools 管理</h2><p>Tool 负责确定性数据读取、去重、排序和证据保存；测试调用服务端实现。</p></div><button class="btn" id="reloadAdmin">刷新</button></div>'+(a?'<div class="split"><div class="side tool-list">'+a.tools.map(x=>'<div class="tool-row '+(state.toolId===x.id?"active":"")+'" data-tool="'+esc(x.id)+'"><strong>'+esc(x.name)+'</strong><small>'+esc(x.id)+' · '+(x.enabled?"启用":"停用")+'</small></div>').join("")+'</div><div><h3>'+esc(t?.name||"")+'</h3><p>'+esc(t?.description||"")+'</p><div class="field"><label>测试输入 JSON</label><textarea id="toolInput">'+esc(JSON.stringify(t?.id?.includes("candidate")?{candidates:[]}: {},null,2))+'</textarea></div><button class="btn" id="runTool">执行 Tool</button><pre class="mono" id="toolOutput">执行后显示真实输出、耗时和错误。</pre></div></div>':'<div class="empty">正在读取 Tools…</div>')+'</section>'}
function viewPlanner(){return '<section class="panel"><div class="panel-head"><div><h2>Planner 管理</h2><p>Planner 只能选择已启用的 Skills 与 Tools，并检查必需能力。</p></div><button class="btn" id="savePlanner">保存配置</button></div>'+(state.planner?'<div class="field"><label>System Prompt</label><textarea id="plannerPrompt" style="min-height:160px">'+esc(state.planner.systemPrompt||"")+'</textarea></div><div class="field"><label>必需 Skills（每行一个）</label><textarea id="mandatorySkills">'+esc((state.planner.mandatorySkills||[]).join("\n"))+'</textarea></div><div class="field"><label>执行空间预览问题</label><input id="plannerQuestion" value="'+esc(moduleId==="creators"?"找粉丝小于1500且做过光子嫩肤的素人":"审核这篇含有全网第一和根治承诺的图文")+'"></div><div class="actions"><button class="btn orange" id="previewPlanner">预览计划</button></div><pre class="mono" id="plannerOutput">预览后显示 selected Skills、Tools 和校验结果。</pre>':'<div class="empty">正在读取 Planner…</div>')+'</section>'}
function viewModel(){return '<section class="panel"><div class="panel-head"><div><h2>模型管理</h2><p>文本模型和视觉模型独立展示；视觉能力不可用时由备用视觉 Skill 接管并保留证据。</p></div><button class="btn" id="reloadModel">刷新</button></div>'+(state.model?'<div class="kpi-list"><div class="kpi">Provider<strong>'+esc(state.model.config?.text?.provider||"")+'</strong></div><div class="kpi">文本模型<strong>'+esc(state.model.config?.text?.model||"")+'</strong></div><div class="kpi">视觉模型<strong>'+esc(state.model.config?.vision?.model||"")+'</strong></div></div><p>文本配置：'+(state.model.status?.text?.configured?"已配置":"未配置")+'；视觉配置：'+(state.model.status?.vision?.configured?"已配置":"未配置")+'。'+esc(state.model.note||"")+'</p><div class="grid-2"><div class="field"><label>文本模型连通性测试</label><input id="modelPrompt" value="返回 JSON：{ok:true,message:string}"><button class="btn" id="testText">测试文本模型</button></div><div class="field"><label>视觉模型连通性测试</label><input id="modelImage" placeholder="可粘贴 data URL"><button class="btn" id="testVision">测试视觉模型</button></div></div><pre class="mono" id="modelOutput">测试结果会显示在这里。</pre>':'<div class="empty">正在读取模型配置…</div>')+'</section>'}
function viewOps(){const runs=state.data.runs||[],avg=runs.length?Math.round(runs.reduce((a,x)=>a+(x.durationMs||0),0)/runs.length):0;return '<section class="panel"><div class="panel-head"><div><h2>运营中心</h2><p>从真实 Run、低质量结果和人工复核入口发现问题；当前模块数据实时聚合。</p></div></div><div class="kpi-list"><div class="kpi">运行总数<strong>'+runs.length+'</strong></div><div class="kpi">平均耗时<strong>'+avg+' ms</strong></div><div class="kpi">需复核<strong>'+runs.filter(x=>x.status==="REVIEW").length+'</strong></div></div><div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr><th>Run</th><th>用例</th><th>状态</th><th>证据</th><th>操作</th></tr></thead><tbody>'+runs.slice(0,30).map(r=>'<tr><td>'+esc(r.id)+'</td><td>'+esc(r.caseId)+'</td><td><span class="status '+statusClass(r.status)+'">'+esc(r.status)+'</span></td><td>'+esc((r.evidence||[]).slice(0,3).join("；"))+'</td><td><button class="btn secondary" data-run="'+esc(r.id)+'">查看 Trace</button></td></tr>').join("")||'<tr><td colspan="5" class="empty">暂无运行记录</td></tr>'+'</tbody></table></div><pre class="mono" id="trace">选择 Run 查看完整 Trace。</pre></section>'}
function render(){const d=state.data;if(!d){$("view").innerHTML='<div class="empty">正在读取 Eval 数据…</div>';return}const runs=d.runs||[],counts=["PASS","FAIL","REVIEW","ERROR"].map(s=>runs.filter(r=>r.status===s).length);$("workspaceTabs").innerHTML=tabs.map(t=>'<button class="'+(state.tab===t[0]?"active":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join("");$("workspaceTabs").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;location.hash=state.tab;render();if(state.tab==="skills"||state.tab==="tools")loadAdmin();if(state.tab==="planner")loadPlanner();if(state.tab==="model")loadModel()});$("metrics").innerHTML='<article class="metric"><span>启用用例</span><strong>'+d.enabledCases.length+'</strong><em>当前业务模块</em></article><article class="metric"><span>Agent Trace</span><strong>'+runs.length+'</strong><em>真实执行记录</em></article><article class="metric"><span>PASS / FAIL</span><strong>'+counts[0]+' / '+counts[1]+'</strong><em>规则评测结果</em></article><article class="metric"><span>REVIEW / ERROR</span><strong>'+counts[2]+' / '+counts[3]+'</strong><em>分开处理</em></article>';const views={cases:viewCases,single:viewSingle,batches:viewBatches,skills:viewSkills,tools:viewTools,planner:viewPlanner,model:viewModel,ops:viewOps};$("view").innerHTML=(views[state.tab]||viewCases)();bind()}
function bind(){document.querySelectorAll("[data-case]").forEach(i=>i.onchange=()=>{i.checked?state.selected.add(i.dataset.case):state.selected.delete(i.dataset.case);render()});document.querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>{state.caseId=b.dataset.test;state.tab="single";render();runOne()});document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=async()=>{try{await get(apiBase+"/cases/"+encodeURIComponent(b.dataset.toggle),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:!b.textContent.includes("停用")})});await load();show("用例状态已保存","ok")}catch(e){show(e.message,"error")}});document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const c=state.data.cases.find(x=>x.id===b.dataset.copy);try{const copy={...c,id:c.id+"-copy-"+Date.now(),name:c.name+"（复制）",source:"manual"};delete copy.createdAt;delete copy.updatedAt;await get(apiBase+"/cases",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(copy)});await load();show("用例已复制","ok")}catch(e){show(e.message,"error")}});if($("selectThree"))$("selectThree").onclick=()=>{state.selected.clear();state.data.enabledCases.slice(0,3).forEach(c=>state.selected.add(c.id));render()};if($("runSelected"))$("runSelected").onclick=()=>runBatch([...state.selected]);if($("runOne"))$("runOne").onclick=runOne;if($("caseSelect"))$("caseSelect").onchange=e=>{state.caseId=e.target.value;state.run=null;render()};if($("runAll"))$("runAll").onclick=()=>runBatch(state.data.enabledCases.map(c=>c.id));document.querySelectorAll("[data-batch]").forEach(b=>b.onclick=()=>{state.batchId=b.dataset.batch;render()});if(state.tab==="batches"){const b=state.data.batches.find(x=>x.id===state.batchId)||state.data.batches[0];if(b)loadBatch(b.id)}if($("compare"))$("compare").onclick=compareLatest;if($("reloadAdmin"))$("reloadAdmin").onclick=loadAdmin;document.querySelectorAll("[data-skill]").forEach(x=>x.onclick=()=>{state.skillId=x.dataset.skill;render()}) async function runOne(){if(!state.caseId)return;try{clearNotice();const d=await get(apiBase+"/cases/"+encodeURIComponent(state.caseId)+"/run",{method:"POST"});state.run=d.run;state.tab="single";render();show("单条测试完成，以下结果可逐项核验","ok")}catch(e){show(e.message,"error")}}
async function runBatch(ids){if(!ids.length)return show("请至少选择一条启用用例","error");try{const d=await get(apiBase+"/batches",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:moduleName+"回归批次",versionLabel:"manual-"+Date.now(),caseIds:ids})});state.batchId=d.batch.id;state.tab="batches";render();show("批次已创建，正在执行真实 Agent 链路");for(let i=0;i<300;i++){await new Promise(r=>setTimeout(r,1000));const x=await get(apiBase+"/batches/"+d.batch.id);if(["done","error","cancelled"].includes(x.batch.status))break}await load();state.tab="batches";render();show("批次已到达终态","ok")}catch(e){show(e.message,"error")}}
async function loadBatch(id){try{const d=await get(apiBase+"/batches/"+id);$("batchDetail").innerHTML='<section class="panel"><h3>'+esc(d.batch.name)+' · '+esc(d.batch.status)+'</h3><p>进度：'+d.batch.currentIndex+'/'+d.batch.total+' · PASS '+d.batch.passed+' · FAIL '+d.batch.failed+' · REVIEW '+d.batch.review+' · ERROR '+d.batch.errors+'</p><div class="table-wrap"><table class="table"><thead><tr><th>用例</th><th>状态</th><th>原因</th><th>核验结果</th></tr></thead><tbody>'+d.runs.map(r=>'<tr><td>'+esc(r.caseId)+'<br><small>'+r.durationMs+' ms</small></td><td><span class="status '+statusClass(r.status)+'">'+esc(r.status)+'</span></td><td>'+esc(r.reason||"")+'</td><td><details><summary>展开证据</summary>'+renderResult(r,state.data.cases.find(c=>c.id===r.caseId))+'</details></td></tr>').join("")+'</tbody></table></div></section>'}catch(e){show(e.message,"error")}}
async function compareLatest(){const b=state.data.batches||[];if(b.length<2)return show("至少需要两个批次才能比较","error");try{const d=await get(apiBase+"/compare?left="+encodeURIComponent(b[1].id)+"&right="+encodeURIComponent(b[0].id));$("compareResult").innerHTML='<section class="panel"><h3>版本对比</h3><p class="status '+(d.comparable?"PASS":"REVIEW")+'">'+esc(d.reason)+'</p><p>已修复：'+esc((d.fixed||[]).join("、")||"无")+'；新增失败：'+esc((d.regressions||[]).join("、")||"无")+'；回复变化：'+esc((d.replyChanged||[]).join("、")||"无")+'</p></section>'}catch(e){show(e.message,"error")}}
async function loadAdmin(){try{state.admin=await get("/api/module-admin/"+moduleId);if(!state.skillId)state.skillId=state.admin.skills[0]?.id||"";if(!state.toolId)state.toolId=state.admin.tools[0]?.id||"";render();show("Skills / Tools 配置已刷新","ok")}catch(e){show(e.message,"error")}}

</script><script data-case-form-enhancer>
(function(){

  function formMarkup(item){

  function bindCaseForm(){
