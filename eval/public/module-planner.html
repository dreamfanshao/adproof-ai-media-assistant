<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner 管理</title><link rel="stylesheet" href="/module.css"></head>
<body><div class="app"><aside class="rail"><div class="brand"><i class="brand-mark"></i><span><strong>媒介助手</strong><small>PLANNER CONTROL</small></span></div><div class="module-label">业务模块</div><nav id="railNav"></nav><div class="rail-footer"><strong>配置持久化</strong><br>保存后的 Planner 配置写入本地 Eval 数据目录。</div></aside><section class="workspace"><header class="topbar"><div class="title"><h1 id="pageTitle">Planner 管理</h1><p id="pageSubtitle"></p></div><nav class="global-tabs" id="globalTabs"></nav></header><main class="content"><div class="module-stripe"></div><div id="notice" class="notice"></div><section class="section"><div class="section-head"><div><h2 id="moduleTitle"></h2><p>配置 System Prompt、必经 Skill、Tool 分组和模型参数，并校验生产运行时编排。</p></div><button class="btn" id="save">保存配置</button></div><div class="section-body"><div class="eval-tabs planner-tabs" id="tabs"><button data-tab="prompt" class="active">System Prompt</button><button data-tab="skills">必经 Skill</button><button data-tab="tools">Tool 分组</button><button data-tab="model">模型参数</button><button data-tab="preview">执行空间预览</button></div><div id="panel"></div></div></section></main></section></div>
<script>
const moduleId=location.pathname.split('/').filter(Boolean).pop()==='audit'?'audit':'creators',creator=moduleId==='creators',moduleName=creator?'达人检索':'内容审核',accent=creator?'creator':'audit';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let data=null,admin=null,modelData=null,tab='prompt';
function nav(){const links=[['/agent/'+moduleId,'Agent 控制台'],['/admin/'+moduleId+'?focus=skills','Skills'],['/admin/'+moduleId+'?focus=tools','Tools'],['/planner/'+moduleId,'Planner'],['/models/'+moduleId,'模型管理'],['/ops/'+moduleId,'运营中心'],['/catalog/'+moduleId,'数据中心']];$('globalTabs').innerHTML=links.map(([href,label],i)=>`<a class="${i===3?'active':''}" href="${href}">${label}</a>`).join('');$('railNav').innerHTML=`<a href="http://127.0.0.1:5173/${creator?'creators':'audit/new'}">返回业务系统</a><a href="/agent/${moduleId}">${moduleName} Agent</a><a href="/admin/${moduleId}?focus=skills">Skills / Tools</a><a class="active ${accent}-active" href="/planner/${moduleId}">Planner 管理</a><a href="/ops/${moduleId}">${moduleName} Eval</a>`}
function message(text,ok=false){const n=$('notice');n.textContent=text;n.className='notice show '+(ok?'ok':'')}
async function api(path,options){const r=await fetch(path,{cache:'no-store',...options}),b=await r.json();if(!r.ok)throw Error(b?.data?.error||'请求失败');return b.data}
function render(){if(!data||!admin||!modelData)return;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const p=data.toolGroups||{},skills=admin.skills||[],toolMap=new Map((admin.tools||[]).map(x=>[x.id,x]));if(tab==='prompt')$('panel').innerHTML=`<div class="field"><label>Planner System Prompt</label><textarea id="prompt" rows="14">${esc(data.systemPrompt)}</textarea><p class="muted-box">该配置用于本地 Planner 验证；执行预览直接镜像生产 Worker 能力顺序。Planner 只能选择服务端已启用能力，不能调用静态候选冒充 RedFox 数据。</p></div>`;if(tab==='skills')$('panel').innerHTML=`<div class="panel-heading"><div><h2>生产 Skill 目录（${skills.filter(x=>x.enabled).length}/${skills.length} 已启用）</h2><p class="sub">勾选表示生产流水线中的必经能力；全部条目来自服务端统一注册表。</p></div></div><div class="cards">${skills.map(skill=>`<label class="skill-card"><input type="checkbox" data-required="${esc(skill.id)}" ${(data.mandatorySkills||[]).includes(skill.id)?'checked':''} ${skill.enabled?'':'disabled'}> <strong>${esc(skill.name)}</strong><span class="chip ${accent}">${esc(skill.id)}</span><p>${esc(skill.description)}</p><small>${esc(skill.kind)} · v${Number(skill.version||1)} · ${skill.enabled?'已启用':'已停用'}</small></label>`).join('')}</div>`;if(tab==='tools')$('panel').innerHTML=`<div class="panel-heading"><div><h2>生产 Tool 分组（${admin.metrics.enabledTools}/${admin.metrics.tools} 已启用）</h2><p class="sub">这里只配置 Tool 分组，不执行 Tool；具体测试模式请到 Tools 页面查看。</p></div></div>${Object.entries(p).map(([name,ids])=>`<section class="section"><div class="section-head"><h2>${esc(name)}</h2></div><div class="section-body cards">${(ids||[]).map(id=>{const tool=toolMap.get(id);return `<label class="skill-card"><input type="checkbox" data-tool-group="${esc(name)}" value="${esc(id)}" checked ${tool?.enabled===false?'disabled':''}> <strong>${esc(tool?.name||id)}</strong><span class="chip ${accent}">${esc(id)}</span><p>${esc(tool?.description||'注册表中未找到该 Tool')}</p><small>${tool?.enabled===false?'已停用':'已启用'}</small></label>`}).join('')}</div></section>`).join('')}`;if(tab==='model')$('panel').innerHTML=`<div class="muted-box"><strong>真实模型路由</strong><br>Provider 与模型名称来自“模型管理”，不能在 Planner 中形成第二套配置。当前状态：${modelData.status.text.configured?'已配置':'未配置密钥，运行将返回 pending_llm'}。</div><div class="grid-2"><div class="field"><label>Provider</label><input id="provider" value="${esc(data.model.provider)}" readonly></div><div class="field"><label>模型</label><input id="model" value="${esc(data.model.model)}" readonly></div><div class="field"><label>temperature</label><input id="temperature" type="number" min="0" max="2" step="0.1" value="${data.model.temperature}"></div><div class="field"><label>maxTokens</label><input id="maxTokens" type="number" min="200" max="16000" value="${data.model.maxTokens}"></div></div><a class="btn secondary" href="/models/${moduleId}">打开模型管理</a>`;if(tab==='preview')$('panel').innerHTML=`<div class="field"><label>测试问题</label><textarea id="previewQuestion" rows="4">${creator?'1000-5000粉丝，做过光子嫩肤或有雀斑困扰，近三个月笔记点赞10以上的个人博主':'审核这篇含有全网第一和祛斑功效承诺的小红书图文'}</textarea></div><p class="muted-box"><strong>测试模式：生产运行时编排校验</strong><br>读取生产能力清单、启用状态和必经 Skill；不调用模型、RedFox，不写数据库，也不生成候选人。</p><button class="btn ${accent}" id="preview">校验生产编排</button><pre id="previewResult" class="mono">尚未校验。</pre>`;if(tab==='preview')$('preview').onclick=async()=>{const out=$('previewResult');out.textContent='正在校验生产编排…';try{out.textContent=JSON.stringify(await api('/api/module-admin/'+moduleId+'/planner/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('previewQuestion').value})}),null,2)}catch(e){out.textContent='ERROR: '+e.message}}}
const renderPanel=render;
render=function(){renderPanel();if(tab!=='model')return;if(creator){$('panel').querySelector('.muted-box').innerHTML=`<strong>真实 Planner 模型参数</strong><br>Provider 与模型名称来自“模型管理”；temperature 和 maxTokens 保存后由生产 Planner 直接读取。当前状态：${modelData.status.text.configured?'已配置':'未配置密钥，运行将返回 pending_llm'}。`;return}$('panel').innerHTML=`<div class="muted-box"><strong>内容审核采用确定性编排</strong><br>当前生产审核流水线没有单独调用 Planner 模型，因此不展示虚假的 temperature 或 maxTokens。各 AI Skill 的模型参数请在 Skills 页面查看，统一模型路由在“模型管理”中维护。</div><div class="grid-2"><div class="field"><label>Provider</label><input id="provider" value="${esc(data.model.provider)}" readonly></div><div class="field"><label>模型</label><input id="model" value="${esc(data.model.model)}" readonly></div></div><a class="btn secondary" href="/models/${moduleId}">打开模型管理</a>`}
function collect(){if(tab==='prompt'&&$('prompt'))data.systemPrompt=$('prompt').value;if(tab==='skills')data.mandatorySkills=[...document.querySelectorAll('[data-required]:checked')].map(x=>x.dataset.required);if(tab==='tools'){const groups={};document.querySelectorAll('[data-tool-group]').forEach(x=>{if(!groups[x.dataset.toolGroup])groups[x.dataset.toolGroup]=[];if(x.checked)groups[x.dataset.toolGroup].push(x.value)});data.toolGroups=groups}if(tab==='model'&&creator)data.model={provider:$('provider').value,model:$('model').value,temperature:Number($('temperature').value),maxTokens:Number($('maxTokens').value)}}
$('tabs').onclick=e=>{const button=e.target.closest('button[data-tab]');if(!button)return;collect();tab=button.dataset.tab;render()};$('save').onclick=async()=>{try{collect();data=await api('/api/module-planner/'+moduleId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});message('Planner 配置已保存',true);render()}catch(e){message(e.message)}};
$('moduleTitle').textContent=moduleName+' Planner';$('pageSubtitle').textContent='生产 Skill、Tool、模型与执行顺序的本地运行时镜像';nav();Promise.all([api('/api/module-planner/'+moduleId),api('/api/module-admin/'+moduleId),api('/api/model-config')]).then(([planner,adminData,models])=>{data=planner;admin=adminData;modelData=models;render()}).catch(e=>message(e.message));
</script></body></html>
