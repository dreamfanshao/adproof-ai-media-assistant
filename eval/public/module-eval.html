<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模块 Eval</title><link rel="stylesheet" href="/module.css"></head>
<body><div class="app">
  <aside class="rail"><div class="brand"><i class="brand-mark"></i><span><strong>媒介助手</strong><small>QUALITY LAB</small></span></div><div class="module-label">产品模块</div><nav id="railNav"></nav><div class="rail-footer"><strong>同源链路评测</strong><br>每条用例调用对应 Agent，再依据本次 Trace 评分。</div></aside>
  <section class="workspace"><header class="topbar"><div class="title"><h1 id="pageTitle">Eval</h1><p id="pageSubtitle">读取评测集…</p></div><div class="context" id="context"></div></header><main class="content"><div class="module-stripe"></div><div id="notice" class="notice"></div><section class="summary" id="metrics"><div class="loading">加载中…</div></section><div id="view"></div></main></section>
</div><script>
const moduleId=location.pathname.split("/").filter(Boolean).pop()==="audit"?"audit":"creators";
const isOps=location.pathname.startsWith("/ops/"),isCreator=moduleId==="creators",moduleName=isCreator?"达人检索":"内容审核",accent=isCreator?"creator":"audit";
const $=(id)=>document.getElementById(id),esc=(v)=>String(v??"").replace(/[&<>"']/g,(m)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const state={data:null,tab:"cases",selected:new Set(),selectedBatch:"",compareLeft:"",compareRight:""};
function message(text,ok=false){const n=$("notice");n.textContent=text;n.className=`notice show ${ok?"ok":""}`;setTimeout(()=>n.className="notice",4500)}
async function api(path,options){const response=await fetch(path,{cache:"no-store",...options});const body=await response.json();if(!response.ok)throw Error(body?.data?.error||"请求失败");return body.data}
function shell(){document.title=`${moduleName}${isOps?"运营中心":"Eval"} · 媒介助手`;$("pageTitle").textContent=`${moduleName}${isOps?"运营中心":"Eval"}`;$("pageSubtitle").textContent=isCreator?"分别验证意图解析、语义匹配、图片证据、去重与排序。":"分别验证规则召回、文本/图片理解、风险分级和人工复核摘要。";$("context").innerHTML=`<a href="/admin/${moduleId}">后台</a><a class="active" href="/eval/${moduleId}">Eval</a>`;$("railNav").innerHTML=`<a href="http://127.0.0.1:5173/${isCreator?"creators":"audit/new"}">返回业务系统</a><a href="/admin/creators">达人后台</a><a class="${isCreator?"active creator-active":""}" href="/eval/creators">达人 Eval</a><a href="/admin/audit">审核后台</a><a class="${!isCreator?"active audit-active":""}" href="/eval/audit">审核 Eval</a>`}
async function load(){state.data=await api(`/api/module-eval/${moduleId}`);if(!state.selected.size)state.data.enabledCases.slice(0,3).forEach((item)=>state.selected.add(item.id));if(!state.selectedBatch)state.selectedBatch=state.data.batches[0]?.id||"";render()}
function render(){const d=state.data,latest=d.latestBatch;$("metrics").innerHTML=`<div class="metric"><span>启用用例</span><strong>${d.enabledCases.length}/${d.cases.length}</strong><em>${d.evaluatorVersion}</em></div><div class="metric"><span>历史批次</span><strong>${d.batches.length}</strong><em>独立模块数据</em></div><div class="metric"><span>最近 PASS</span><strong>${latest?.passed??0}</strong><em>ERROR 不计入质量失败</em></div><div class="metric"><span>Provider</span><strong style="font-size:16px">${esc(d.runs[0]?.provider||"unconfigured")}</strong><em>${esc(d.runs[0]?.model||"未运行")}</em></div>`;renderView()}
function tabs(){return `<div class="toolbar"><button class="btn ${state.tab==="cases"?accent:"secondary"}" data-tab="cases">评测集</button><button class="btn ${state.tab==="batches"?accent:"secondary"}" data-tab="batches">批次与结果</button><button class="btn ${state.tab==="compare"?accent:"secondary"}" data-tab="compare">版本对比</button></div>`}
function renderView(){$("view").innerHTML=tabs()+(state.tab==="cases"?casesView():state.tab==="batches"?batchesView():compareView());document.querySelectorAll("[data-tab]").forEach((button)=>button.onclick=()=>{state.tab=button.dataset.tab;renderView()});if(state.tab==="cases")bindCases();if(state.tab==="batches")bindBatches();if(state.tab==="compare")bindCompare()}
function casesView(){const d=state.data;return `<section class="section" style="margin-top:14px"><div class="section-head"><div><h2>${moduleName}评测集</h2><p>默认勾选 3 条；单条和批量都调用同一个 Agent 执行链。</p></div><div class="toolbar"><button class="btn secondary" id="selectThree">选择前 3 条</button><button class="btn ${accent}" id="runSelected">运行已选（${state.selected.size}）</button></div></div><div class="section-body"><div class="cards">${d.cases.map((item)=>`<article class="case-card"><header><div><h3><label><input type="checkbox" data-case="${esc(item.id)}" ${state.selected.has(item.id)?"checked":""} ${!item.enabled?"disabled":""}> ${esc(item.name)}</label></h3><span class="chip ${accent}">${esc(item.category)}</span></div><button class="btn secondary" data-toggle="${esc(item.id)}">${item.enabled?"停用":"启用"}</button></header><p>${esc(item.question)}</p><div class="meta"><span class="chip">${esc(item.difficulty)}</span><span class="chip">输入风险 ${esc(item.riskLevel)}</span>${item.requiredCapabilities.slice(0,3).map((cap)=>`<span class="chip">${esc(cap)}</span>`).join("")}</div><p><strong>期望：</strong>${item.expectedBehavior.map(esc).join("；")}</p></article>`).join("")}</div></div></section>`}
function bindCases(){document.querySelectorAll("[data-case]").forEach((input)=>input.onchange=()=>{input.checked?state.selected.add(input.dataset.case):state.selected.delete(input.dataset.case);renderView()});document.querySelectorAll("[data-toggle]").forEach((button)=>button.onclick=async()=>{const item=state.data.cases.find((row)=>row.id===button.dataset.toggle);await api(`/api/module-eval/${moduleId}/cases/${encodeURIComponent(item.id)}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:!item.enabled})});state.selected.delete(item.id);await load()});$("selectThree").onclick=()=>{state.selected.clear();state.data.enabledCases.slice(0,3).forEach((item)=>state.selected.add(item.id));renderView()};$("runSelected").onclick=()=>run([...state.selected])}
async function run(caseIds){if(!caseIds.length)return message("至少选择一条启用用例。");try{const body=await api(`/api/module-eval/${moduleId}/batches`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:`${moduleName}手动回归`,versionLabel:"workspace",caseIds})});state.selectedBatch=body.batch.id;state.tab="batches";renderView();for(let index=0;index<180;index+=1){await new Promise((resolve)=>setTimeout(resolve,500));const detail=await api(`/api/module-eval/${moduleId}/batches/${body.batch.id}`);if(["done","error","cancelled"].includes(detail.batch.status))break}await load();state.tab="batches";renderView();message("评测批次已到达终态。",true)}catch(error){message(error.message)}}
function batchesView(){const d=state.data,batch=d.batches.find((item)=>item.id===state.selectedBatch)||d.batches[0];return `<section class="section" style="margin-top:14px"><div class="section-head"><div><h2>批次记录</h2><p>每批保留 caseIds、用例快照、Provider、模型和评测器版本。</p></div><button class="btn ${accent}" id="runAgain" ${!d.enabledCases.length?"disabled":""}>运行全部启用用例</button></div><div class="section-body split"><div class="list">${d.batches.map((item)=>`<button class="${batch?.id===item.id?"active":""}" data-batch="${item.id}"><strong>${esc(item.name)}</strong><small>${item.total} 条 · PASS ${item.passed} · FAIL ${item.failed} · REVIEW ${item.review} · ERROR ${item.errors}</small></button>`).join("")||`<div class="empty"><strong>暂无批次</strong>从评测集中选择用例开始运行。</div>`}</div><div id="batchDetail">${batch?`<div class="loading">读取批次明细…</div>`:`<div class="empty"><strong>选择一个批次</strong></div>`}</div></div></section>`}
function bindBatches(){document.querySelectorAll("[data-batch]").forEach((button)=>button.onclick=()=>{state.selectedBatch=button.dataset.batch;renderView()});$("runAgain").onclick=()=>run(state.data.enabledCases.map((item)=>item.id));const batch=state.data.batches.find((item)=>item.id===state.selectedBatch)||state.data.batches[0];if(batch)api(`/api/module-eval/${moduleId}/batches/${batch.id}`).then(renderBatchDetail).catch((error)=>message(error.message))}
function renderBatchDetail(data){const b=data.batch,runs=data.runs;$("batchDetail").innerHTML=`<div class="grid-3"><div class="metric"><span>进度</span><strong>${b.currentIndex}/${b.total}</strong></div><div class="metric"><span>质量结果</span><strong>${b.passed}/${b.failed}/${b.review}</strong></div><div class="metric"><span>ERROR</span><strong>${b.errors}</strong></div></div><p class="meta"><span class="chip">${esc(b.provider)}</span><span class="chip">${esc(b.model)}</span><span class="chip">${esc(b.evaluatorVersion)}</span><span class="status ${b.status==="done"?"PASS":b.status==="error"?"ERROR":"REVIEW"}">${esc(b.status)}</span></p><div class="table-wrap"><table class="table"><thead><tr><th>用例</th><th>状态</th><th>原因</th><th>能力路径</th><th>实际回复 / Trace</th></tr></thead><tbody>${runs.map((run)=>`<tr><td><strong>${esc(run.caseId)}</strong><br><small>${run.durationMs} ms</small></td><td><span class="status ${run.status}">${run.status}</span></td><td>${esc(run.reason)}${run.error?`<div class="notice show">${esc(run.error)}</div>`:""}</td><td>${run.capabilityHits.slice(0,6).map((cap)=>`<span class="chip">${esc(cap)}</span>`).join(" ")} ${run.capabilityMisses.length?`<p class="status FAIL">缺少 ${esc(run.capabilityMisses.join("、"))}</p>`:""}</td><td><details><summary>查看实际结果与证据</summary><div class="mono">${esc(run.actual)}</div><div class="mono">${esc(JSON.stringify(run.trace,null,2))}</div></details></td></tr>`).join("")||`<tr><td colspan="5">尚未产生结果</td></tr>`}</tbody></table></div>`}
function compareView(){const batches=state.data.batches.filter((item)=>item.status==="done");return `<section class="section" style="margin-top:14px"><div class="section-head"><div><h2>版本对比</h2><p>只有用例快照、评测器、Provider 和模型一致时才允许直接比较。</p></div></div><div class="section-body"><div class="grid-2"><div class="field"><label>基线批次</label><select id="left"><option value="">请选择</option>${batches.map((b)=>`<option value="${b.id}" ${state.compareLeft===b.id?"selected":""}>${esc(b.name)} · ${b.id}</option>`).join("")}</select></div><div class="field"><label>对比批次</label><select id="right"><option value="">请选择</option>${batches.map((b)=>`<option value="${b.id}" ${state.compareRight===b.id?"selected":""}>${esc(b.name)} · ${b.id}</option>`).join("")}</select></div></div><p><button class="btn ${accent}" id="compare">开始比较</button></p><div id="compareResult" class="empty"><strong>选择两个批次</strong>系统会先检查可比较性。</div></div></section>`}
function bindCompare(){$("left").onchange=(e)=>state.compareLeft=e.target.value;$("right").onchange=(e)=>state.compareRight=e.target.value;$("compare").onclick=async()=>{if(!state.compareLeft||!state.compareRight)return message("请选择两个批次。");const d=await api(`/api/module-eval/${moduleId}/compare?left=${encodeURIComponent(state.compareLeft)}&right=${encodeURIComponent(state.compareRight)}`);$("compareResult").className="";$("compareResult").innerHTML=`<p><span class="status ${d.comparable?"PASS":"REVIEW"}">${d.comparable?"可比较":"不可直接比较"}</span> ${esc(d.reason)}</p><div class="grid-3"><div class="metric"><span>已修复</span><strong>${d.fixed.length}</strong><em>${esc(d.fixed.join("、")||"无")}</em></div><div class="metric"><span>新增失败</span><strong>${d.regressions.length}</strong><em>${esc(d.regressions.join("、")||"无")}</em></div><div class="metric"><span>回复变化</span><strong>${d.replyChanged.length}</strong><em>状态相同但输出变化</em></div></div>`}}
const baseShell=shell;shell=function(){baseShell();$("railNav").insertAdjacentHTML("beforeend",`<a href="/models/${moduleId}">模型管理</a><a href="/ops/${moduleId}">运营中心</a><a href="/catalog/${moduleId}">数据中心</a>`)};
shell();load().catch((error)=>message(`加载失败：${error.message}`));
</script></body></html>
