<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运营与质量工作区 · 媒介助手</title>
  <style>
    :root{--bg:#f5f7fa;--surface:#fff;--ink:#172033;--muted:#68758a;--line:#dce3ec;--brand:#315ee8;--brand-soft:#e9efff;font-family:"IBM Plex Sans","Noto Sans SC","Microsoft YaHei",Segoe UI,sans-serif}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}button{font:inherit}
    .shell{height:100%;min-width:0;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}
    .topbar{min-width:0;min-height:76px;padding:0 28px;display:flex;align-items:center;gap:28px;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:relative;z-index:2}
    .brand{display:flex;align-items:center;gap:11px;white-space:nowrap;font-size:20px;font-weight:800;letter-spacing:-.03em}.mark{width:18px;height:18px;border-radius:5px 1px 5px 1px;transform:rotate(45deg);background:linear-gradient(135deg,#91aaff,#315ee8);box-shadow:0 5px 15px #315ee833}
    .tabs{display:flex;align-items:stretch;gap:3px;overflow:auto;min-width:0;scrollbar-width:thin}.tab{position:relative;border:0;background:transparent;color:#5f6d82;padding:27px 13px 24px;font-weight:700;white-space:nowrap;cursor:pointer}.tab:hover{color:var(--ink);background:#f7f9fc}.tab[aria-selected="true"]{color:var(--brand);background:linear-gradient(180deg,#f3f6ff 0%,#fff 100%)}.tab[aria-selected="true"]:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:999px;background:var(--brand)}
    .stage{position:relative;min-width:0;min-height:0}.module-frame{width:100%;height:100%;border:0;display:block;background:var(--bg)}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:#f5f7fae8;color:var(--muted);font-size:14px;z-index:1}.loading[hidden]{display:none}.loading span{display:flex;align-items:center;gap:10px}.loading i{width:16px;height:16px;border:2px solid #cbd6ea;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .tab:focus-visible{outline:3px solid #315ee833;outline-offset:-4px}
    @media(max-width:760px){.topbar{min-height:auto;padding:12px 14px;display:block}.brand{padding:3px 6px 12px;font-size:18px}.tabs{width:100%;max-width:100%;margin:0 -4px}.tab{padding:12px 10px 11px}.stage{min-height:0}}
    @media(prefers-reduced-motion:reduce){.loading i{animation:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><i class="mark" aria-hidden="true"></i><span>媒介助手</span></div>
      <nav class="tabs" role="tablist" aria-label="运营与质量模块">
        <button class="tab" role="tab" data-view="admin">后台管理</button>
        <button class="tab" role="tab" data-view="skills">Skills</button>
        <button class="tab" role="tab" data-view="tools">Tools</button>
        <button class="tab" role="tab" data-view="planner">Planner</button>
        <button class="tab" role="tab" data-view="models">模型管理</button>
        <button class="tab" role="tab" data-view="ops">运营中心</button>
        <button class="tab" role="tab" data-view="eval">评测中心</button>
      </nav>
    </header>
    <main class="stage">
      <div class="loading" id="workspaceLoading"><span><i aria-hidden="true"></i>正在加载模块…</span></div>
      <iframe class="module-frame" id="workspaceFrame" title="工作区内容"></iframe>
    </main>
  </div>
  <script>
    (()=>{
      const routes={admin:"/workspace/admin",skills:"/workspace/skills",tools:"/workspace/tools",planner:"/workspace/planner",models:"/workspace/models",ops:"/workspace/ops#ops",eval:"/workspace/eval"};
      const frame=document.getElementById("workspaceFrame"),loading=document.getElementById("workspaceLoading"),tabs=[...document.querySelectorAll("[data-view]")];
      const pathDefault=location.pathname.startsWith("/admin")?"admin":"eval";
      const remembered=sessionStorage.getItem("adproof-workspace-tab");
      const initial=pathDefault==="admin"?"admin":(routes[remembered]?remembered:pathDefault);
      function activate(view){if(!routes[view])return;tabs.forEach(tab=>tab.setAttribute("aria-selected",String(tab.dataset.view===view)));loading.hidden=false;frame.src=routes[view];sessionStorage.setItem("adproof-workspace-tab",view)}
      tabs.forEach(tab=>tab.addEventListener("click",()=>activate(tab.dataset.view)));
      frame.addEventListener("load",()=>{loading.hidden=true});
      activate(initial);
    })();
  </script>
</body>
</html>
