<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型管理</title><link rel="stylesheet" href="/module.css"></head>
<body><div class="app">
  <aside class="rail"><div class="brand"><i class="brand-mark"></i><span><strong>媒介助手</strong><small>MODEL CONTROL</small></span></div><div class="module-label">产品模块</div><nav id="railNav"></nav><div class="rail-footer"><strong>密钥安全边界</strong><br>只读取服务端环境变量，不在浏览器显示 Key。</div></aside>
  <section class="workspace"><header class="topbar"><div class="title"><h1 id="pageTitle">模型管理</h1><p id="pageSubtitle">文本与视觉模型分别配置。</p></div><div class="context" id="context"></div></header><main class="content"><div class="module-stripe"></div><div id="notice" class="notice"></div><div id="view"><div class="loading">正在读取模型配置…</div></div></main></section>
</div><script>
const moduleId=location.pathname.split("/").filter(Boolean).pop()==="audit"?"audit":"creators",isCreator=moduleId==="creators",moduleName=isCreator?"达人检索":"内容审核",accent=isCreator?"creator":"audit";
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
let data=null;
async function api(path,options){const r=await fetch(path,{cache:"no-store",...options}),b=await r.json();if(!r.ok)throw Error(b?.data?.error||"请求失败");return b.data}
function note(text,ok=false){const n=$("notice");n.textContent=text;n.className=`notice show ${ok?"ok":""}`;setTimeout(()=>n.className="notice",3500)}
function routeForm(id,title,route,presets){return `<section class="section"><div class="section-head"><div><h2>${title}</h2><p>接口兼容 OpenAI Chat Completions；API Key 通过环境变量 ${esc(route.apiKeyEnv)} 读取。</p></div><span class="status ${data.status[id].configured?"PASS":"REVIEW"}">${data.status[id].configured?"已配置":"未配置"}</span></div><div class="section-body"><div class="grid-2"><label>Provider<select id="${id}Provider">${Object.entries(presets).map(([key,p])=>`<option value="${key}" ${route.provider===key?"selected":""}>${esc(key)} · ${esc(p.model||"自定义")}</option>`).join("")}</select></label><label>模型名称<input id="${id}Model" value="${esc(route.model)}"></label></div><div class="grid-2"><label>Base URL<input id="${id}Base" value="${esc(route.baseUrl)}"></label><label>API Key 环境变量<input id="${id}Key" value="${esc(route.apiKeyEnv)}"><small>只保存变量名，不保存密钥。</small></label></div><label class="check"><input type="checkbox" id="${id}Vision" ${route.supportsVision?"checked":""}> 此模型支持视觉输入</label><div class="section-body muted-box"><strong>连接状态：</strong>${esc(data.status[id].configured?"环境变量已存在，测试会实际调用模型。":"未检测到环境变量，测试将返回结构化配置错误。")}</div><button class="btn ${accent}" data-test="${id}">测试${title}</button><pre class="mono" id="${id}Result">尚未测试。</pre></div></section>`}
function render(){const c=data.config,p=data.presets;$("pageTitle").textContent=`${moduleName}模型管理`;$(("pageSubtitle")).textContent="文本与视觉可以使用不同的国内模型；视觉请求可单独走备用模型。";$("context").innerHTML=`<a href="/admin/${moduleId}">后台</a><a href="/eval/${moduleId}">Eval</a>`;$("railNav").innerHTML=`<a href="http://127.0.0.1:5173/${isCreator?"creators":"audit/new"}">返回业务系统</a><a href="/admin/${moduleId}">${moduleName}后台</a><a href="/eval/${moduleId}">${moduleName} Eval</a><a class="active ${accent}-active" href="/models/${moduleId}">模型管理</a><a href="/ops/${moduleId}">运营中心</a><a href="/catalog/${moduleId}">数据中心</a>`;$("view").innerHTML=`<section class="section"><div class="section-head"><div><h2>路由策略</h2><p>主流程中的文本请求和图片请求分别选择模型，不混淆评测结果。</p></div><span class="chip ${accent}">${c.visionFallbackEnabled?"已启用视觉兜底":"未启用视觉兜底"}</span></div><div class="section-body"><label class="check"><input id="visionFallback" type="checkbox" ${c.visionFallbackEnabled?"checked":""}> 当视觉主路由不可用时，允许使用备用视觉模型</label><p class="muted-box">当前图片请求使用“视觉模型”路由；找达人图片证据和内容审核图片理解都会经过同一套路由，并在 Trace 中记录 provider、model 与 fallbackUsed。</p></div></section>${routeForm("text","文本模型",c.text,p)}${routeForm("vision","视觉模型",c.vision,p)}<section class="section"><div class="section-head"><div><h2>保存配置</h2><p>保存后只影响后续 Agent 运行，历史 RunRecord 保留原 Provider 和模型。</p></div><button class="btn ${accent}" id="save">保存模型配置</button></div><div class="section-body"><pre class="mono" id="saveResult">未保存。</pre></div></section>`;bind()}
function bind(){for(const id of ["text","vision"]){$(id+"Provider").onchange=()=>{const preset=data.presets[$(id+"Provider").value];if(!preset)return;$(id+"Model").value=preset.model;$(id+"Base").value=preset.baseUrl;$(id+"Key").value=preset.apiKeyEnv;$(id+"Vision").checked=preset.supportsVision}}$("save").onclick=async()=>{try{const body={visionFallbackEnabled:$("visionFallback").checked,text:{provider:$("textProvider").value,model:$("textModel").value,baseUrl:$("textBase").value,apiKeyEnv:$("textKey").value,supportsVision:$("textVision").checked},vision:{provider:$("visionProvider").value,model:$("visionModel").value,baseUrl:$("visionBase").value,apiKeyEnv:$("visionKey").value,supportsVision:$("visionVision").checked}};data=await api("/api/model-config",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});note("模型配置已保存。",true);render()}catch(e){note(e.message)}};for(const id of ["text","vision"]){$(id+"Result").textContent="尚未测试。";document.querySelector(`[data-test="${id}"]`).onclick=async()=>{const out=$(id+"Result");out.textContent="正在连接模型…";try{const result=await api("/api/model-config/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:id,prompt:"请只返回 JSON：{ok:true,message:\"连接成功\"}"})});out.textContent=JSON.stringify(result,null,2)}catch(e){out.textContent=`ERROR: ${e.message}`}}}}
async function load(){try{data=await api("/api/model-config");render()}catch(e){note(e.message)}}
load();
</script><script>
(()=>{const path=location.pathname,mod=path.split('/').filter(Boolean).pop()==='audit'?'audit':'creators',isC=mod==='creators',name=isC?'达人检索':'内容审核',accent=isC?'creator':'audit';const c=document.getElementById('context');if(c){c.className='global-tabs';c.innerHTML=[['/agent/'+mod,'Agent 控制台'],['/admin/'+mod+'?focus=skills','Skills'],['/admin/'+mod+'?focus=tools','Tools'],['/planner/'+mod,'Planner'],['/models/'+mod,'模型管理'],['/ops/'+mod,'运营中心'],['/catalog/'+mod,'数据中心']].map(([h,l])=>`<a href="${h}" class="${location.pathname===h?'active':''}">${l}</a>`).join('')}const rail=document.getElementById('railNav');if(rail){const extra=[['/agent/'+mod,name+' Agent'],['/planner/'+mod,'Planner 管理']];extra.forEach(([h,l])=>{if(![...rail.querySelectorAll('a')].some(a=>a.getAttribute('href')===h)){const a=document.createElement('a');a.href=h;a.textContent=l;rail.appendChild(a)}})}})();
</script></body></html>
