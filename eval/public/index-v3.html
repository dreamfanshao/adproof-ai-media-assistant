px}.detail{min-width:0}.panel-head,.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:22px 25px 18px}.panel-head h2,.card-head h2{font-size:20px;margin:0 0 5px;letter-spacing:-.02em}.panel-head p,.card-head p{margin:0;color:var(--muted);font-size:13px}.detail-body,.card-body{padding:23px 25px;display:grid;gap:20px}.actions{display:flex;flex-wrap:wrap;gap:8px}.field{display:grid;gap:7px}.field label{font-size:13px;color:#625b55}.field textarea{min-height:105px;resize:vertical;line-height:1.55}.field textarea.mini{min-height:75px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border-radius:999px;background:#f5f2ef;padding:5px 9px;color:#5e5750;font-size:12px}.chip.orange{background:var(--orange-soft);color:#b93808}.mono{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:7px;padding:12px;font:12px/1.6 ui-monospace,Consolas,monospace}.empty{display:grid;place-items:center;min-height:300px;color:var(--muted);text-align:center;padding:30px}.empty strong{display:block;color:#4b4540;font-size:16px;margin-bottom:8px}.card{border:1px solid var(--line);border-radius:9px;background:#fff}.card-head{padding:19px 22px}.card-head h2{font-size:18px}.card-body{padding:22px}.run-wrap,.results-wrap{display:grid;gap:16px}.run-select{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{padding:13px 14px;border:1px solid var(--line);border-radius:7px;background:#fff}.metric strong{display:block;font-size:23px}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:12px}.metric.pass strong{color:var(--green)}.metric.fail strong{color:var(--red)}.metric.review strong{color:var(--amber)}.progress{height:8px;border-radius:99px;background:#eee9e4;overflo /* Original Nexus theme override: keep the Eval structure, restore the main app's blue-indigo palette. */
:root{--ink:#1c2333;--muted:#64748b;--line:#e3e6ef;--soft:#f3f4f8;--orange:#3b71ff;--orange-soft:#eaf2ff;--green:#16a34a;--green-soft:#e9f8f1;--amber:#d97706;--amber-soft:#fff7e6;--red:#dc2626;--red-soft:#fff1f1}
body{background:#f3f4f8;color:var(--ink)}
.eyebrow{color:#3b71ff}

.product-nav__mark{width:12px;height:12px;display:inline-block;transform:rotate(45deg);border-radius:2px;background:linear-gradient(135deg,#315de7 0%,#7ca4ff 100%);box-shadow:0 0 0 3px #4f7df31a}
.product-nav a{display:inline-flex;align-items:center;min-height:34px;padding:7px 11px;border-radius:7px;color:#64748b;text-decoration:none;white-space:nowrap}
.product-nav a:hover{background:#f8fafc;color:#1c2333}
.product-nav a.is-active{background:#eaf2ff;color:#315de7;font-weight:700}
.admin-wrap{display:grid;gap:16px}
.admin-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px 25px;border:1px solid #cfe0ff;border-radius:9px;background:linear-gradient(120deg,#f8fbff 0%,#eef5ff 100%)}
.admin-hero h2{margin:0 0 6px;font-size:22px}
.admin-hero p{margin:0;color:#64748b}
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.admin-card{border:1px solid var(--line);border-radius:9px;background:#fff;padding:17px}
.admin-card h3{margin:0 0 8px;font-size:15px}
.admin-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.admin-card strong{display:block;font-size:25px;color:#1c2333}
.admin-card small{display:block;margin-top:5px;color:#94a3b8}
.admin-card--link{display:flex;flex-direction:column;min-height:132px}
.admin-card--link a{margin-top:auto;color:#315de7;text-decoration:none;font-weight:650}
.admin-card--link a:hover{text-decoration:underline}
.admin-section{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.admin-list{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.admin-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eef0f6}
.admin-list li:last-child{border-bottom:0}
.admin-status{display:inline-flex;align-items:center;gap:6px;color:#0a9f6e;font-size:12px;font-weight:650}
.admin-status i{width:7px;height:7px;border-radius:50%;background:#16a34a}
@media(max-width:920px){.admin-grid{grid-template-columns:repeat(2,1fr)}.admin-section{grid-template-columns:1fr}}
@media(max-width:580px){.product-nav__brand{width:100%;margin-right:0}.admin-grid{grid-template-columns:1fr}.admin-hero{display:block}}
</style>

<body><div class="shell"><header class="top"><div><div class="eyebrow">Agent 质量验证</div><h1>Eval 评测中心</h1><p>每次测试调用生产同源 Agent 链路，再依据本次回复与 Trace 评分。</p></div><div class="stats" id="stats"></div></header><nav class="tabs"><button data-tab="cases" class="active">评测集</button><button data-tab="run">单条测试</button><button data-tab="results">批次与结果</button></nav><div id="notice" class="notice" hidden></div><main id="view"></main><div class="footer">本地 Eval 仅用于研发验证；未人工核验的样本不会计入通过。</div></div>
<script>
const $=id=>document.getElementById(id),view=$("view"),arr=x=>Array.isArray(x)?x:[],esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const state={data:{cases:[],enabledCases:[],batches:[],results:[]},tab:"cases",selectedId:"",query:"",suite:"all",risk:"all",enabledOnly:true,editing:null,selectedBatch:""};
async function api(path,opts){const r=await fetch(path,{cache:"no-store",...opts});const b=await r.json();if(!r.ok)throw Error(b?.error||b?.data?.error||"请求失败");return b}
function msg(t){const n=$("notice");n.textContent=t;n.hidden=false;setTimeout(()=>n.hidden=true,3500)}
async function load(){const [o,b]=await Promise.all([api("/api/eval"),api("/api/eval/batches")]);state.data={...o,batches:b.data.batches};if(!state.selectedId)state.selectedId=state.data.enabledCases[0]?.id||state.data.cases[0]?.id||"";if(!state.selectedBatch)state.selectedBatch=state.data.batches[0]?.id||"";render()}
function render(){$("stats").innerHTML=`<span class="badge">${state.data.cases.length} 条用例</span><span class="badge ok">✓ ${state.data.enabledCases.length} 条启用</span>`;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x.dataset.tab===state.tab));({cases:renderCases,run:renderRun,results:renderResults}[state.tab])()}
document.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{state.tab=x.dataset.tab;state.editing=null;render()});
function list(){return state.data.cases.filter(x=>(!state.enabledOnly||x.enabled)&&(!state.suite||state.suite==="all"||x.suite===state.suite)&&(!state.risk||state.risk==="all"||x.riskLevel===state.risk)&&`${x.name}${x.input}${x.id}`.toLowerCase().includes(state.query.toLowerCase()))}
function empty(text){return `<div class="empty"><div><strong>${esc(text)}</strong><span>调整筛选条件或创建一个新的评测用例。</span></div></div>`}
function renderCases(){const items=list(),selected=state.data.cases.find(x=>x.id===state.selectedId);view.innerHTML=`<section class="case-grid"><aside class="case-side"><div class="filters"><label class="search"><span>⌕</span><input id="q" value="${esc(state.query)}" placeholder="搜索名称、问题或标签"></label><div class="filter-row"><select id="suite"><option value="all">分类：全部</option>${[...new Set(state.data.cases.map(x=>x.suite))].map(x=>`<option value="${esc(x)}" ${x===state.suite?"selected":""}>${esc(x)}</option>`).join("")}</select><select id="risk"><option value="all">风险：全部</option>${["low","medium","high"].map(x=>`<option ${x===state.risk?"selected":""}>${x}</option>`).join("")}</select></div><label class="check"><input id="enabled" type="checkbox" ${state.enabledOnly?"checked":""}>仅显示启用用例</label><button class="btn primary full" id="new">＋ 新增用例</button></div><div class="case-list">${items.length?items.map(item).join(""):empty("没有符合筛选条件的评测用例")}</div></aside><section class="detail">${state.editing?editor(state.editing):selected?detail(selected):empty("选择一条用例查看详情，或新增评测用例")}</section></section>`;bindCases()}
function item(x){return `<button class="case-item ${x.id===state.selectedId&&!state.editing?"active":""}" data-id="${esc(x.id)}"><i class="dot ${x.enabled?"on":""}"></i><span class="case-copy"><span class="case-name">${esc(x.name)}</span><span class="case-meta">${esc(x.suite)} · ${esc(x.riskLevel)} · ${x.enabled?"启用":"停用"}</span></span><span class="chev">›</span></button>`}
function detail(x){return `<div class="panel-head"><div><h2>${esc(x.name)} <span class="badge ${x.enabled?"ok":""}">${x.enabled?"已启用":"已停用"}</span></h2><p>${esc(x.id)} · 更新于 ${new Date(x.updatedAt).toLocaleString("zh-CN")}</p></div><div class="actions"><button class="btn outline" id="toggle">${x.enabled?"停用":"启用"}</button><button class="btn outline" id="edit">编辑</button><button class="btn dark" id="one">▶ 运行</button><button class="btn danger" id="delete">删除</button></div></div><div class="detail-body"><div class="field"><label>测试问题</label><div class="mono">${esc(x.input)}</div></div><div class="three"><div><label class="muted">场景 / 分类</label><div>${esc(x.suite)}</div></div><div><label class="muted">输入风险</label><div>${esc(x.riskLevel)}</div></div><div><label class="muted">评测维度</label><div class="chips">${arr(x.dimensions).map(v=>`<span class="chip">${esc(v)}</span>`).join("")}</div></div></div><div class="field"><label>预期行为</label><div>${arr(x.expectedBehavior).map(v=>`<div>• ${esc(v)}</div>`).join("")||"未设置"}</div></div><div class="two"><div class="field"><label>预期结果</label><div class="mono">${esc(x.expected)}</div></div><div class="field"><label>关键词组</label><div class="mono">${esc(JSON.stringify(x.expectedKeywords||{},null,2))}</div></div></div></div>`}
function editor(x){const n=x==="new",v=n?{id:"",name:"",suite:"通用",input:"",expected:"",expectedBehavior:["准确回答并说明事实依据"],expectedKeywords:{},riskLevel:"low",dimensions:["correctness","relevance"],enabled:true}:x;return `<div class="panel-head"><div><h2>${n?"新增评测用例":"编辑评测用例"}</h2><p>保存后进入 EvalCase 目录，并在下次批次运行时快照。</p></div><button class="btn ghost" id="cancel">取消</button></div><div class="detail-body"><div class="two"><div class="field"><label>名称</label><input id="name" value="${esc(v.name)}"></div><div class="field"><label>分类</label><input id="suite2" value="${esc(v.suite)}"></div></div><div class="field"><label>测试问题</label><textarea id="input">${esc(v.input)}</textarea></div><div class="field"><label>预期结果</label><textarea id="expected">${esc(v.expected)}</textarea></div><div class="two"><div class="field"><label>预期行为（每行一条）</label><textarea class="mini" id="behavior">${esc(arr(v.expectedBehavior).join("\n"))}</textarea></div><div class="field"><label>关键词组 JSON</label><textarea class="mini" id="keywords">${esc(JSON.stringify(v.expectedKeywords||{},null,2))}</textarea></div></div><div class="three"><div class="field"><label>输入风险</label><select id="risk2">${["low","medium","high"].map(z=>`<option ${z===v.riskLevel?"selected":""}>${z}</option>`).join("")}</select></div><div class="field"><label>评测维度（逗号分隔）</label><input id="dims" value="${esc(arr(v.dimensions).join(","))}"></div><label class="check" style="align-self:end"><input id="enabled2" type="checkbox" ${v.enabled?"checked":""}>启用此用例</label></div><div class="actions"><button class="btn primary" id="save">保存用例</button><button class="btn outline" id="cancel2">取消</button></div></div>`}
function bindCases(){const q=$("q");if(q){q.oninput=()=>{state.query=q.value;renderCases()};$("suite").onchange=e=>{state.suite=e.target.value;renderCases()};$("risk").onchange=e=>{state.risk=e.target.value;renderCases()};$("enabled").onchange=e=>{state.enabledOnly=e.target.checked;renderCases()};$("new").onclick=()=>{state.editing="new";renderCases()};document.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>{state.selectedId=x.dataset.id;state.editing=null;renderCases()})}const x=state.data.cases.find(v=>v.id===state.selectedId);if($("toggle"))$("toggle").onclick=async()=>{await api(`/api/eval/cases/${encodeURIComponent(x.id)}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:!x.enabled})});await load()};if($("edit"))$("edit").onclick=()=>{state.editing=x;renderCases()};if($("one"))$("one").onclick=()=>run([x.id]);if($("delete"))$("delete").onclick=async()=>{if(confirm(`确认删除“${x.name}”？`)){await api(`/api/eval/cases/${encodeURIComponent(x.id)}`,{method:"DELETE"});state.selectedId="";await load()}};["cancel","cancel2"].forEach(id=>$(id)&&($(id).onclick=()=>{state.editing=null;renderCases()}));if($("save"))$("save").onclick=save}
async function save(){let kw={};try{kw=JSON.parse($("keywords").value||"{}")}catch{msg("关键词组 JSON 格式不正确");return}const n=state.editing==="new",id=n?`EC-${Date.now()}`:state.editing.id,b={id,name:$("name").value.trim(),suite:$("suite2").value.trim()||"通用",input:$("input").value.trim(),expected:$("expected").value.trim(),expectedBehavior:$("behavior").value.split(/\n/).map(x=>x.trim()).filter(Boolean),expectedKeywords:kw,forbiddenWords:[],riskLevel:$("risk2").value,dimensions:$("dims").value.split(",").map(x=>x.trim()).filter(Boolean),enabled:$("enabled2").checked,source:n?"manual":state.editing.source};if(!b.name||!b.input||!b.expected){msg("名称、测试问题和预期结果不能为空");return}await api(n?"/api/eval/cases":`/api/eval/cases/${encodeURIComponent(id)}`,{method:n?"POST":"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});state.selectedId=id;state.editing=null;await load()}
function renderRun(){const selected=state.data.cases.find(x=>x.id===state.selectedId)||state.data.enabledCases[0];view.innerHTML=`<section class="run-wrap"><div class="card"><div class="card-head"><div><h2>单条测试</h2><p>选择一个启用用例，创建批次并保存评分结果。</p></div><span class="badge">${state.data.enabledCases.length} 条可运行</span></div><div class="card-body"><div class="run-select"><div class="field"><label>评测用例</label><select id="runCase">${state.data.enabledCases.map(x=>`<option value="${esc(x.id)}" ${selected&&x.id===selected.id?"selected":""}>${esc(x.name)} · ${esc(x.suite)}</option>`).join("")}</select></div><button class="btn primary" id="runSelected">▶ 开始测试</button></div><div class="field"><label>本次输入</label><div class="mono">${esc(selected?.input||"请选择用例")}</div></div><div class="field"><label>评测规则</label><div class="chips">${arr(selected?.dimensions).map(x=>`<span class="chip orange">${esc(x)}</span>`).join("")}<span class="chip">PASS / FAIL / REVIEW / ERROR</span></div></div></div></div><div class="card"><div class="card-head"><div><h2>运行说明</h2><p>批次会保存用例快照。语义匹配没有人工结论时保持 REVIEW。</p></div></div><div class="card-body"><div class="three"><div><strong>1 · 选择</strong><p class="muted">从评测集选用例</p></div><div><strong>2 · 运行</strong><p class="muted">创建批次并执行</p></div><div><strong>3 · 复核</strong><p class="muted">在批次与结果中查看</p></div></div></div></div></section>`;$("runCase").onchange=e=>{state.selectedId=e.target.value;renderRun()};$("runSelected").onclick=()=>run([$("runCase").value])}
async function run(ids){if(!ids?.length)return;try{const c=await api("/api/eval/batches",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:ids.length===1?"单条测试":"全量回归评测",versionLabel:"workspace",caseIds:ids})});const b=c.data.batch;state.selectedBatch=b.id;state.tab="results";render();for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,500));const d=await api(`/api/eval/batches/${b.id}`);if(["done","error","cancelled"].includes(d.data.batch.status))break}await load()}catch(e){msg(e.message)}}
async function renderResults(){const batches=state.data.batches;const selected=state.selectedBatch?batches.find(x=>x.id===state.selectedBatch):batches[0];if(selected)state.selectedBatch=selected.id;let d=null;if(selected)try{d=(await api(`/api/eval/batches/${selected.id}`)).data}catch{}view.innerHTML=`<section class="results-wrap"><div class="card"><div class="card-head"><div><h2>批次与结果</h2><p>每次运行保留用例快照、评分状态和结果明细。</p></div><button class="btn outline" id="runAll">↻ 运行全部启用用例</button></div><div class="card-body"><div class="batch-list">${batches.length?batches.map(batchRow).join(""):empty("暂无批次记录，请从单条测试开始")}</div></div></div>${d?batchDetail(d):empty("选择一个批次查看结果")}</section>`;document.querySelectorAll("[data-batch]").forEach(el=>el.onclick=()=>{state.selectedBatch=el.dataset.batch;renderResults()});$("runAll").onclick=()=>run(state.data.enabledCases.map(x=>x.id))}
function batchRow(x){return `<button class="batch-row ${x.id===state.selectedBatch?"selected":""}" data-batch="${esc(x.id)}"><span><strong>${esc(x.name)}</strong><small>${esc(x.id)} · ${new Date(x.createdAt).toLocaleString("zh-CN")} · ${esc(x.versionLabel)}</small></span><span class="count">${x.total} 用例</span><span class="count pass">${x.passed} PASS</span><span class="count fail">${x.failed} FAIL</span><span class="count review">${x.review} REVIEW</span><span class="count">${x.status}</span></button>`}
function batchDetail(d){const b=d.batch,r=d.results||[];return `<div class="card"><div class="card-head"><div><h2>${esc(b.name)} <span class="status ${b.status==="done"?"PASS":b.status==="error"?"ERROR":"REVIEW"}">${esc(b.status)}</span></h2><p>${esc(b.id)} · ${esc(b.evaluatorVersion)} · 用例快照 ${esc((b.caseSetHash||"").slice(0,12))}</p></div></div><div class="card-body"><div class="metrics"><div class="metric"><strong>${b.total}</strong><span>用例总数</span></div><div class="metric pass"><strong>${b.passed}</strong><span>PASS</span></div><div class="metric fail"><strong>${b.failed}</strong><span>FAIL</span></div><div class="metric review"><strong>${b.review}</strong><span>REVIEW</span></div><div class="metric"><strong>${b.errors}</strong><span>ERROR</span></div></div><div class="progress"><i style="width:${b.total?Math.round(b.currentIndex/b.total*100):0}%"></i></div><div class="table-wrap"><table class="table"><thead><tr><th>用例</th><th>状态</th><th>评分方式</th><th>输入 / 预期</th><th>证据与说明</th></tr></thead><tbody>${r.map(x=>`<tr><td><strong>${esc(x.caseId)}</strong><br><span class="muted">${esc(x.suite)}</span></td><td><span class="status ${esc(x.status)}">${esc(x.status)}</span></td><td>${esc(x.scoringMethod)}</td><td>${esc(x.input).slice(0,100)}<br><span class="muted">期望：${esc(x.expected).slice(0,100)}</span></td><td>${esc(x.detail||x.actual).slice(0,180)}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">批次尚未产生结果</td></tr>`}</tbody></table></div></div></div>`}
load().catch(e=>msg(e.message));
</script></body></html>
